<style>
/* Layout: one centered column, Apple-style big headline, frosted sticky toolbar, inset grouped list */
:root {
  --bg: #ffffff;
  --fg: #1d1d1f;
  --muted: #6e6e73;
  --line: #d2d2d7;
  --soft: #f5f5f7;
  --raise: #ffffff;
  --code: #fbfbfd;
  --glass: rgba(255,255,255,.78);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --fg: #f5f5f7; --muted: #86868b; --line: #2d2d30;
    --soft: #161617; --raise: #1d1d1f; --code: #0b0b0c; --glass: rgba(0,0,0,.72);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --fg: #f5f5f7; --muted: #86868b; --line: #2d2d30;
  --soft: #161617; --raise: #1d1d1f; --code: #0b0b0c; --glass: rgba(0,0,0,.72);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--sans); font-size: 17px; line-height: 1.47;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 880px; margin: 0 auto; padding-inline: 20px; }

/* Hero */
header.hero { padding-block: 72px 40px; text-align: center; }
.eyebrow { font-size: 14px; font-weight: 600; letter-spacing: .02em; color: var(--muted); }
h1 {
  margin: 10px 0 0; font-size: clamp(48px, 11vw, 96px); line-height: 1; font-weight: 700;
  letter-spacing: -0.045em; text-wrap: balance;
}
.lede { margin: 20px auto 0; max-width: 34ch; font-size: clamp(19px, 2.6vw, 24px); line-height: 1.35; color: var(--muted); font-weight: 500; letter-spacing: -0.01em; text-wrap: balance; }
.stats { display: flex; justify-content: center; gap: 36px; margin-top: 36px; flex-wrap: wrap; }
.stat b { display: block; font-size: 32px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.progress { width: min(260px, 70%); height: 4px; border-radius: 4px; background: var(--soft); margin: 18px auto 0; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--fg); transition: width .4s ease; }

/* Toolbar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--line);
}
.bar .wrap { display: grid; gap: 12px; padding-block: 12px; }
.row1 { display: flex; gap: 10px; align-items: center; }
.search { position: relative; flex: 1; min-width: 0; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--muted); }
.search input {
  width: 100%; height: 38px; border-radius: 10px; border: 0; padding: 0 12px 0 36px;
  background: var(--soft); color: var(--fg); font: 16px var(--sans); outline: none;
}
.search input:focus-visible { box-shadow: 0 0 0 2px var(--fg); }
.seg { display: inline-flex; background: var(--soft); border-radius: 9px; padding: 2px; flex-shrink: 0; }
.seg button {
  border: 0; background: transparent; color: var(--fg); font: 500 13px var(--sans);
  padding: 7px 12px; border-radius: 7px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--raise); box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 0 0 .5px var(--line); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -20px; padding-inline: 20px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; border: 1px solid var(--line); background: transparent; color: var(--fg);
  font: 500 13px var(--sans); padding: 6px 13px; border-radius: 999px; cursor: pointer; white-space: nowrap;
}
.chip small { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip[aria-pressed="true"] small { color: var(--bg); opacity: .65; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

/* List */
main { padding-block: 28px 80px; }
.meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 0 4px 10px; }
.meta button { border: 0; background: none; color: var(--muted); font: inherit; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
ul.list { list-style: none; margin: 0; padding: 0; background: var(--soft); border-radius: 18px; overflow: hidden; }
.item + .item { border-top: 1px solid var(--line); }
.item .head { display: flex; align-items: center; gap: 4px; padding-left: 10px; }
.check {
  width: 36px; height: 36px; flex-shrink: 0; border: 0; background: none; cursor: pointer; display: grid; place-items: center; border-radius: 50%;
}
.check span { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; transition: all .2s; }
.check svg { width: 11px; height: 11px; stroke: var(--bg); opacity: 0; }
.check[aria-pressed="true"] span { background: var(--fg); border-color: var(--fg); }
.check[aria-pressed="true"] svg { opacity: 1; }
.open {
  flex: 1; min-width: 0; display: grid; grid-template-columns: 52px 1fr auto 16px; align-items: center; gap: 12px;
  border: 0; background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer; padding: 15px 18px 15px 4px;
}
.num { font: 400 14px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.title { font-weight: 500; letter-spacing: -0.01em; min-width: 0; }
.topic { font-size: 14px; color: var(--muted); white-space: nowrap; }
.chev { width: 14px; height: 14px; stroke: var(--muted); transition: transform .25s ease; }
.item.is-open .chev { transform: rotate(90deg); }
.item.done .title { color: var(--muted); }

.detail { padding: 4px 22px 26px 66px; display: grid; gap: 18px; }
.detail[hidden] { display: none; }
.detail .tags { display: flex; flex-wrap: wrap; gap: 6px; }
.detail .tags span { font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 6px; background: var(--raise); border: 1px solid var(--line); }
.label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.approach { margin: 0; max-width: 64ch; font-size: 16px; line-height: 1.6; }
.cx { display: flex; gap: 10px; flex-wrap: wrap; margin: 0; }
.cx div { background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; min-width: 0; }
.cx dt { font-size: 12px; color: var(--muted); }
.cx dd { margin: 2px 0 0; font: 600 14px var(--mono); }
.code { border: 1px solid var(--line); border-radius: 14px; background: var(--code); overflow: hidden; min-width: 0; }
.code-top { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px 8px 16px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.copy { border: 1px solid var(--line); background: var(--raise); color: var(--fg); font: 500 12px var(--sans); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.code pre { margin: 0; padding: 16px 18px; overflow-x: auto; font: 13.5px/1.65 var(--mono); tab-size: 4; }
.code .k { font-weight: 600; }
.code .c { color: var(--muted); font-style: italic; }
.code .s { color: var(--muted); }
.code .n, .code .sf { opacity: .7; }
.code .d { font-weight: 600; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.links { display: flex; gap: 18px; font-size: 15px; }
.links a { color: var(--fg); font-weight: 500; text-decoration: none; }
.links a:hover { text-decoration: underline; }

.empty { text-align: center; padding: 56px 20px; color: var(--muted); }
footer { text-align: center; font-size: 12px; color: var(--muted); padding-block: 0 48px; }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }

@media (max-width: 600px) {
  header.hero { padding-block: 48px 28px; }
  .stats { gap: 24px; }
  .open { grid-template-columns: 40px 1fr 14px; gap: 8px; padding-right: 14px; }
  .topic { display: none; }
  .detail { padding: 2px 16px 22px 16px; }
  .seg button { padding: 7px 9px; }
  .row1 { flex-wrap: wrap; }
  .search { flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script>
const DATA = [{"n": 4, "t": "Median of Two Sorted Arrays", "topic": "Binary Search", "tags": ["Array", "Divide and Conquer"], "a": "Binary search a cut in the shorter array so the left halves of both arrays hold exactly half the elements. The cut is right when every value on the left is at most every value on the right; the median then comes from the four values around the cut.", "tc": "O(log min(m, n))", "sc": "O(1)", "code": "class Solution:\n    def findMedianSortedArrays(self, a, b):\n        if len(a) > len(b):\n            a, b = b, a\n        m, n = len(a), len(b)\n        lo, hi, half = 0, m, (m + n + 1) // 2\n        while lo <= hi:\n            i = (lo + hi) // 2\n            j = half - i\n            aL = a[i - 1] if i else float('-inf')\n            aR = a[i] if i < m else float('inf')\n            bL = b[j - 1] if j else float('-inf')\n            bR = b[j] if j < n else float('inf')\n            if aL <= bR and bL <= aR:\n                if (m + n) % 2:\n                    return max(aL, bL)\n                return (max(aL, bL) + min(aR, bR)) / 2\n            if aL > bR:\n                hi = i - 1\n            else:\n                lo = i + 1", "slug": "median-of-two-sorted-arrays"}, {"n": 10, "t": "Regular Expression Matching", "topic": "Dynamic Programming", "tags": ["String", "Recursion"], "a": "dp[i][j] says whether s[i:] matches p[j:]. Fill from the end. When the next pattern char is '*', either skip the starred pair or, if the current chars match, consume one char of s and stay on the same pattern position.", "tc": "O(m·n)", "sc": "O(m·n)", "code": "class Solution:\n    def isMatch(self, s, p):\n        m, n = len(s), len(p)\n        dp = [[False] * (n + 1) for _ in range(m + 1)]\n        dp[m][n] = True\n        for i in range(m, -1, -1):\n            for j in range(n - 1, -1, -1):\n                first = i < m and p[j] in (s[i], '.')\n                if j + 1 < n and p[j + 1] == '*':\n                    dp[i][j] = dp[i][j + 2] or (first and dp[i + 1][j])\n                else:\n                    dp[i][j] = first and dp[i + 1][j + 1]\n        return dp[0][0]", "slug": "regular-expression-matching"}, {"n": 23, "t": "Merge k Sorted Lists", "topic": "Heap", "tags": ["Linked List", "Divide and Conquer"], "a": "Keep the current head of every list in a min-heap. Pop the smallest node, append it to the result, and push its successor. The list index breaks ties so nodes are never compared directly.", "tc": "O(N log k)", "sc": "O(k)", "code": "import heapq\n\nclass Solution:\n    def mergeKLists(self, lists):\n        heap = [(node.val, i, node) for i, node in enumerate(lists) if node]\n        heapq.heapify(heap)\n        dummy = tail = ListNode()\n        while heap:\n            _, i, node = heapq.heappop(heap)\n            tail.next = node\n            tail = node\n            if node.next:\n                heapq.heappush(heap, (node.next.val, i, node.next))\n        return dummy.next", "slug": "merge-k-sorted-lists"}, {"n": 25, "t": "Reverse Nodes in k-Group", "topic": "Linked List", "tags": ["Recursion"], "a": "Walk k nodes ahead to confirm a full group exists. Reverse that group in place, pointing its old head at the node after the group, then reconnect the previous group's tail to the new head.", "tc": "O(n)", "sc": "O(1)", "code": "class Solution:\n    def reverseKGroup(self, head, k):\n        dummy = ListNode(0, head)\n        prev = dummy\n        while True:\n            kth = prev\n            for _ in range(k):\n                kth = kth.next\n                if not kth:\n                    return dummy.next\n            nxt = kth.next\n            cur, tail = prev.next, nxt\n            while cur is not nxt:\n                cur.next, tail, cur = tail, cur, cur.next\n            first = prev.next\n            prev.next = kth\n            prev = first", "slug": "reverse-nodes-in-k-group"}, {"n": 30, "t": "Substring with Concatenation of All Words", "topic": "Sliding Window", "tags": ["Hash Table", "String"], "a": "All words share one length w, so run w separate sliding windows, one per starting offset, stepping a whole word at a time. Shrink from the left whenever a word appears too often; record the start when the window holds exactly all words.", "tc": "O(n·w)", "sc": "O(k)", "code": "from collections import Counter\n\nclass Solution:\n    def findSubstring(self, s, words):\n        w, k = len(words[0]), len(words)\n        need = Counter(words)\n        res = []\n        for off in range(w):\n            left, count, seen = off, 0, Counter()\n            for right in range(off, len(s) - w + 1, w):\n                word = s[right:right + w]\n                if word in need:\n                    seen[word] += 1\n                    count += 1\n                    while seen[word] > need[word]:\n                        seen[s[left:left + w]] -= 1\n                        left += w\n                        count -= 1\n                    if count == k:\n                        res.append(left)\n                        seen[s[left:left + w]] -= 1\n                        left += w\n                        count -= 1\n                else:\n                    seen.clear()\n                    count = 0\n                    left = right + w\n        return res", "slug": "substring-with-concatenation-of-all-words"}, {"n": 32, "t": "Longest Valid Parentheses", "topic": "Stack", "tags": ["String", "Dynamic Programming"], "a": "Keep a stack of indices with a sentinel for the last unmatched position. Push on '('. On ')', pop; if the stack empties, this ')' becomes the new sentinel, otherwise the valid run ends here and starts after the index on top.", "tc": "O(n)", "sc": "O(n)", "code": "class Solution:\n    def longestValidParentheses(self, s):\n        stack, best = [-1], 0\n        for i, ch in enumerate(s):\n            if ch == '(':\n                stack.append(i)\n            else:\n                stack.pop()\n                if not stack:\n                    stack.append(i)\n                else:\n                    best = max(best, i - stack[-1])\n        return best", "slug": "longest-valid-parentheses"}, {"n": 37, "t": "Sudoku Solver", "topic": "Backtracking", "tags": ["Matrix", "Hash Table"], "a": "Track which digits each row, column and box already uses. Fill empty cells in order, trying only digits that are still legal, and undo the choice when the rest of the board cannot be completed.", "tc": "O(9^e) worst case", "sc": "O(e)", "code": "class Solution:\n    def solveSudoku(self, board):\n        rows = [set() for _ in range(9)]\n        cols = [set() for _ in range(9)]\n        boxes = [set() for _ in range(9)]\n        empty = []\n        for r in range(9):\n            for c in range(9):\n                v = board[r][c]\n                if v == '.':\n                    empty.append((r, c))\n                else:\n                    rows[r].add(v); cols[c].add(v); boxes[r // 3 * 3 + c // 3].add(v)\n\n        def solve(i):\n            if i == len(empty):\n                return True\n            r, c = empty[i]\n            b = r // 3 * 3 + c // 3\n            for v in '123456789':\n                if v in rows[r] or v in cols[c] or v in boxes[b]:\n                    continue\n                board[r][c] = v\n                rows[r].add(v); cols[c].add(v); boxes[b].add(v)\n                if solve(i + 1):\n                    return True\n                rows[r].remove(v); cols[c].remove(v); boxes[b].remove(v)\n            board[r][c] = '.'\n            return False\n\n        solve(0)", "slug": "sudoku-solver"}, {"n": 41, "t": "First Missing Positive", "topic": "Array", "tags": ["Hash Table", "In-place"], "a": "The answer lies in 1..n+1, so use the array itself as the hash table. Swap each value v into slot v-1 until every slot holds its own number or something out of range. The first slot i without i+1 gives the answer.", "tc": "O(n)", "sc": "O(1)", "code": "class Solution:\n    def firstMissingPositive(self, nums):\n        n = len(nums)\n        for i in range(n):\n            while 1 <= nums[i] <= n and nums[nums[i] - 1] != nums[i]:\n                j = nums[i] - 1\n                nums[i], nums[j] = nums[j], nums[i]\n        for i in range(n):\n            if nums[i] != i + 1:\n                return i + 1\n        return n + 1", "slug": "first-missing-positive"}, {"n": 42, "t": "Trapping Rain Water", "topic": "Two Pointers", "tags": ["Array", "Stack"], "a": "Water above a bar is bounded by the smaller of the tallest walls on each side. Move two pointers inward from the lower side; that side's running maximum is already the binding wall, so its water can be added immediately.", "tc": "O(n)", "sc": "O(1)", "code": "class Solution:\n    def trap(self, height):\n        l, r = 0, len(height) - 1\n        lmax = rmax = water = 0\n        while l < r:\n            if height[l] < height[r]:\n                lmax = max(lmax, height[l])\n                water += lmax - height[l]\n                l += 1\n            else:\n                rmax = max(rmax, height[r])\n                water += rmax - height[r]\n                r -= 1\n        return water", "slug": "trapping-rain-water"}, {"n": 44, "t": "Wildcard Matching", "topic": "Greedy", "tags": ["String", "Dynamic Programming"], "a": "Match greedily and remember the most recent '*'. On a mismatch, backtrack to that star and let it absorb one more character of s. Only the latest star ever needs revisiting.", "tc": "O(m·n) worst, usually linear", "sc": "O(1)", "code": "class Solution:\n    def isMatch(self, s, p):\n        i = j = 0\n        star, match = -1, 0\n        while i < len(s):\n            if j < len(p) and p[j] in (s[i], '?'):\n                i += 1\n                j += 1\n            elif j < len(p) and p[j] == '*':\n                star, match = j, i\n                j += 1\n            elif star != -1:\n                j = star + 1\n                match += 1\n                i = match\n            else:\n                return False\n        while j < len(p) and p[j] == '*':\n            j += 1\n        return j == len(p)", "slug": "wildcard-matching"}, {"n": 51, "t": "N-Queens", "topic": "Backtracking", "tags": ["Array"], "a": "Place one queen per row. A square is safe when its column, its r-c diagonal and its r+c anti-diagonal are all unused; three sets make that check O(1).", "tc": "O(n!)", "sc": "O(n²)", "code": "class Solution:\n    def solveNQueens(self, n):\n        res, cols, d1, d2 = [], set(), set(), set()\n        board = [['.'] * n for _ in range(n)]\n\n        def place(r):\n            if r == n:\n                res.append([''.join(row) for row in board])\n                return\n            for c in range(n):\n                if c in cols or r - c in d1 or r + c in d2:\n                    continue\n                cols.add(c); d1.add(r - c); d2.add(r + c)\n                board[r][c] = 'Q'\n                place(r + 1)\n                board[r][c] = '.'\n                cols.remove(c); d1.remove(r - c); d2.remove(r + c)\n\n        place(0)\n        return res", "slug": "n-queens"}, {"n": 52, "t": "N-Queens II", "topic": "Backtracking", "tags": ["Bit Manipulation"], "a": "Same search as N-Queens, but count instead of build boards. Bitmasks for columns and both diagonals give the free squares of a row in one AND; shift the diagonal masks as you descend.", "tc": "O(n!)", "sc": "O(n)", "code": "class Solution:\n    def totalNQueens(self, n):\n        full = (1 << n) - 1\n\n        def go(cols, d1, d2):\n            if cols == full:\n                return 1\n            count = 0\n            free = full & ~(cols | d1 | d2)\n            while free:\n                bit = free & -free\n                free -= bit\n                count += go(cols | bit, ((d1 | bit) << 1) & full, (d2 | bit) >> 1)\n            return count\n\n        return go(0, 0, 0)", "slug": "n-queens-ii"}, {"n": 60, "t": "Permutation Sequence", "topic": "Math", "tags": ["Recursion"], "a": "With i digits left, each choice of leading digit covers (i-1)! permutations. Divide the zero-based k by that factorial to pick the digit, keep the remainder, and repeat with the remaining digits.", "tc": "O(n²)", "sc": "O(n)", "code": "from math import factorial\n\nclass Solution:\n    def getPermutation(self, n, k):\n        digits = [str(i) for i in range(1, n + 1)]\n        k -= 1\n        out = []\n        for i in range(n, 0, -1):\n            idx, k = divmod(k, factorial(i - 1))\n            out.append(digits.pop(idx))\n        return ''.join(out)", "slug": "permutation-sequence"}, {"n": 65, "t": "Valid Number", "topic": "String", "tags": ["State Machine"], "a": "Scan once with three flags: digit seen, dot seen, exponent seen. Signs may only start the string or follow an e. A dot may not follow an exponent, and an exponent needs digits on both sides.", "tc": "O(n)", "sc": "O(1)", "code": "class Solution:\n    def isNumber(self, s):\n        seen_digit = seen_dot = seen_exp = False\n        for i, ch in enumerate(s):\n            if ch.isdigit():\n                seen_digit = True\n            elif ch in '+-':\n                if i > 0 and s[i - 1] not in 'eE':\n                    return False\n            elif ch in 'eE':\n                if seen_exp or not seen_digit:\n                    return False\n                seen_exp, seen_digit = True, False\n            elif ch == '.':\n                if seen_dot or seen_exp:\n                    return False\n                seen_dot = True\n            else:\n                return False\n        return seen_digit", "slug": "valid-number"}, {"n": 68, "t": "Text Justification", "topic": "String", "tags": ["Simulation"], "a": "Pack words greedily until the next one would overflow. Hand out the leftover spaces round-robin across the gaps so the left gaps get the extras. The last line is left-aligned and padded.", "tc": "O(total chars)", "sc": "O(maxWidth)", "code": "class Solution:\n    def fullJustify(self, words, maxWidth):\n        res, line, length = [], [], 0\n        for w in words:\n            if length + len(w) + len(line) > maxWidth:\n                gaps = len(line) - 1 or 1\n                for i in range(maxWidth - length):\n                    line[i % gaps] += ' '\n                res.append(''.join(line))\n                line, length = [], 0\n            line.append(w)\n            length += len(w)\n        res.append(' '.join(line).ljust(maxWidth))\n        return res", "slug": "text-justification"}, {"n": 76, "t": "Minimum Window Substring", "topic": "Sliding Window", "tags": ["Hash Table", "String"], "a": "Expand the right edge and count how many characters of t are still missing. Once none are missing, shrink the left edge past every surplus character, record the window, then drop one needed character to keep searching.", "tc": "O(m + n)", "sc": "O(σ)", "code": "from collections import Counter\n\nclass Solution:\n    def minWindow(self, s, t):\n        need = Counter(t)\n        missing = len(t)\n        left = start = end = 0\n        for right, ch in enumerate(s, 1):\n            if need[ch] > 0:\n                missing -= 1\n            need[ch] -= 1\n            if missing == 0:\n                while need[s[left]] < 0:\n                    need[s[left]] += 1\n                    left += 1\n                if end == 0 or right - left < end - start:\n                    start, end = left, right\n                need[s[left]] += 1\n                missing += 1\n                left += 1\n        return s[start:end]", "slug": "minimum-window-substring"}, {"n": 84, "t": "Largest Rectangle in Histogram", "topic": "Stack", "tags": ["Monotonic Stack", "Array"], "a": "Keep a stack of bars with increasing heights, each tagged with the leftmost index it can extend to. When a shorter bar arrives, pop taller bars, scoring each as height × width up to here. A trailing 0 flushes the stack.", "tc": "O(n)", "sc": "O(n)", "code": "class Solution:\n    def largestRectangleArea(self, heights):\n        stack, best = [], 0\n        for i, h in enumerate(heights + [0]):\n            start = i\n            while stack and stack[-1][1] >= h:\n                idx, hh = stack.pop()\n                best = max(best, hh * (i - idx))\n                start = idx\n            stack.append((start, h))\n        return best", "slug": "largest-rectangle-in-histogram"}, {"n": 85, "t": "Maximal Rectangle", "topic": "Stack", "tags": ["Matrix", "Monotonic Stack"], "a": "Treat each row as the floor of a histogram whose bar heights count consecutive 1s above. Run the Largest Rectangle in Histogram stack on every row.", "tc": "O(m·n)", "sc": "O(n)", "code": "class Solution:\n    def maximalRectangle(self, matrix):\n        heights = [0] * len(matrix[0])\n        best = 0\n        for row in matrix:\n            for j, v in enumerate(row):\n                heights[j] = heights[j] + 1 if v == '1' else 0\n            stack = []\n            for i, h in enumerate(heights + [0]):\n                start = i\n                while stack and stack[-1][1] >= h:\n                    idx, hh = stack.pop()\n                    best = max(best, hh * (i - idx))\n                    start = idx\n                stack.append((start, h))\n        return best", "slug": "maximal-rectangle"}, {"n": 87, "t": "Scramble String", "topic": "Dynamic Programming", "tags": ["String", "Memoization"], "a": "Try every split point. The halves either line up directly or cross over; recurse on both pairings with memoization, and prune any pair whose sorted letters differ.", "tc": "O(n⁴)", "sc": "O(n³)", "code": "from functools import lru_cache\n\nclass Solution:\n    def isScramble(self, s1, s2):\n        @lru_cache(None)\n        def ok(a, b):\n            if a == b:\n                return True\n            if sorted(a) != sorted(b):\n                return False\n            for i in range(1, len(a)):\n                if ok(a[:i], b[:i]) and ok(a[i:], b[i:]):\n                    return True\n                if ok(a[:i], b[-i:]) and ok(a[i:], b[:-i]):\n                    return True\n            return False\n\n        return ok(s1, s2)", "slug": "scramble-string"}, {"n": 115, "t": "Distinct Subsequences", "topic": "Dynamic Programming", "tags": ["String"], "a": "dp[j] counts ways to form t[:j] from the prefix of s seen so far. For each char of s, walk j backwards and add dp[j-1] wherever t[j-1] matches, so each char is used once per subsequence.", "tc": "O(m·n)", "sc": "O(n)", "code": "class Solution:\n    def numDistinct(self, s, t):\n        dp = [1] + [0] * len(t)\n        for ch in s:\n            for j in range(len(t), 0, -1):\n                if t[j - 1] == ch:\n                    dp[j] += dp[j - 1]\n        return dp[-1]", "slug": "distinct-subsequences"}, {"n": 123, "t": "Best Time to Buy and Sell Stock III", "topic": "Dynamic Programming", "tags": ["Array"], "a": "Track four running bests: after first buy, first sell, second buy, second sell. Each one builds on the state before it, all updated in a single pass over the prices.", "tc": "O(n)", "sc": "O(1)", "code": "class Solution:\n    def maxProfit(self, prices):\n        b1 = b2 = float('-inf')\n        s1 = s2 = 0\n        for p in prices:\n            b1 = max(b1, -p)\n            s1 = max(s1, b1 + p)\n            b2 = max(b2, s1 - p)\n            s2 = max(s2, b2 + p)\n        return s2", "slug": "best-time-to-buy-and-sell-stock-iii"}, {"n": 124, "t": "Binary Tree Maximum Path Sum", "topic": "Tree", "tags": ["DFS", "Dynamic Programming"], "a": "For each node, compute the best downward path that starts there, clamping negative child gains to zero. A path that bends at this node uses both children; compare it with the global best.", "tc": "O(n)", "sc": "O(h)", "code": "class Solution:\n    def maxPathSum(self, root):\n        best = float('-inf')\n\n        def gain(node):\n            nonlocal best\n            if not node:\n                return 0\n            l = max(gain(node.left), 0)\n            r = max(gain(node.right), 0)\n            best = max(best, node.val + l + r)\n            return node.val + max(l, r)\n\n        gain(root)\n        return best", "slug": "binary-tree-maximum-path-sum"}, {"n": 126, "t": "Word Ladder II", "topic": "Graph", "tags": ["BFS", "Backtracking"], "a": "BFS level by level, removing each level's words from the dictionary so paths stay shortest, and record every parent that reaches a word. Once the end word appears, walk the parent links back to build every shortest path.", "tc": "O(N·L·26 + output)", "sc": "O(N·L)", "code": "from collections import defaultdict\n\nclass Solution:\n    def findLadders(self, beginWord, endWord, wordList):\n        words = set(wordList)\n        if endWord not in words:\n            return []\n        parents = defaultdict(set)\n        layer, found = {beginWord}, False\n        words.discard(beginWord)\n        while layer and not found:\n            nxt = set()\n            for w in layer:\n                for i in range(len(w)):\n                    for c in 'abcdefghijklmnopqrstuvwxyz':\n                        cand = w[:i] + c + w[i + 1:]\n                        if cand in words:\n                            nxt.add(cand)\n                            parents[cand].add(w)\n                            if cand == endWord:\n                                found = True\n            words -= nxt\n            layer = nxt\n        if not found:\n            return []\n        res = []\n\n        def build(w, path):\n            if w == beginWord:\n                res.append(path[::-1])\n                return\n            for p in parents[w]:\n                build(p, path + [p])\n\n        build(endWord, [endWord])\n        return res", "slug": "word-ladder-ii"}, {"n": 127, "t": "Word Ladder", "topic": "Graph", "tags": ["BFS", "Hash Table"], "a": "Each word is a node and words one letter apart are neighbours. BFS from the start word, generating neighbours by swapping each letter, and remove words from the set as you visit them.", "tc": "O(N·L·26)", "sc": "O(N)", "code": "from collections import deque\n\nclass Solution:\n    def ladderLength(self, beginWord, endWord, wordList):\n        words = set(wordList)\n        if endWord not in words:\n            return 0\n        q = deque([(beginWord, 1)])\n        while q:\n            w, d = q.popleft()\n            if w == endWord:\n                return d\n            for i in range(len(w)):\n                for c in 'abcdefghijklmnopqrstuvwxyz':\n                    cand = w[:i] + c + w[i + 1:]\n                    if cand in words:\n                        words.remove(cand)\n                        q.append((cand, d + 1))\n        return 0", "slug": "word-ladder"}, {"n": 132, "t": "Palindrome Partitioning II", "topic": "Dynamic Programming", "tags": ["String"], "a": "cut[i] is the fewest cuts for s[:i], starting from cut[0] = -1. Expand palindromes around every centre; each palindrome s[a..b] lets cut[b+1] improve to cut[a] + 1.", "tc": "O(n²)", "sc": "O(n)", "code": "class Solution:\n    def minCut(self, s):\n        n = len(s)\n        cut = list(range(-1, n))\n        for mid in range(n):\n            for a, b in ((mid, mid), (mid, mid + 1)):\n                while a >= 0 and b < n and s[a] == s[b]:\n                    cut[b + 1] = min(cut[b + 1], cut[a] + 1)\n                    a -= 1\n                    b += 1\n        return cut[n]", "slug": "palindrome-partitioning-ii"}, {"n": 135, "t": "Candy", "topic": "Greedy", "tags": ["Array"], "a": "Sweep left to right so each child beats a lower-rated left neighbour, then right to left for the right neighbour, keeping the larger of the two requirements.", "tc": "O(n)", "sc": "O(n)", "code": "class Solution:\n    def candy(self, ratings):\n        n = len(ratings)\n        c = [1] * n\n        for i in range(1, n):\n            if ratings[i] > ratings[i - 1]:\n                c[i] = c[i - 1] + 1\n        for i in range(n - 2, -1, -1):\n            if ratings[i] > ratings[i + 1]:\n                c[i] = max(c[i], c[i + 1] + 1)\n        return sum(c)", "slug": "candy"}, {"n": 140, "t": "Word Break II", "topic": "Backtracking", "tags": ["Dynamic Programming", "Memoization"], "a": "From each index, try every dictionary word that starts there and recurse on the rest. Memoize the sentence list for each suffix so shared tails are built once.", "tc": "O(n² + output)", "sc": "O(n + output)", "code": "from functools import lru_cache\n\nclass Solution:\n    def wordBreak(self, s, wordDict):\n        words = set(wordDict)\n\n        @lru_cache(None)\n        def go(i):\n            if i == len(s):\n                return ['']\n            out = []\n            for j in range(i + 1, len(s) + 1):\n                w = s[i:j]\n                if w in words:\n                    for rest in go(j):\n                        out.append(w + (' ' + rest if rest else ''))\n            return out\n\n        return go(0)", "slug": "word-break-ii"}, {"n": 149, "t": "Max Points on a Line", "topic": "Math", "tags": ["Hash Table", "Geometry"], "a": "Fix an anchor point and count the slope to every later point. Store slopes as reduced (dx, dy) pairs with a canonical sign so they hash exactly, avoiding floating-point error.", "tc": "O(n² log C)", "sc": "O(n)", "code": "from math import gcd\nfrom collections import Counter\n\nclass Solution:\n    def maxPoints(self, points):\n        n, best = len(points), 1\n        for i in range(n):\n            slopes = Counter()\n            x1, y1 = points[i]\n            for j in range(i + 1, n):\n                dx, dy = points[j][0] - x1, points[j][1] - y1\n                g = gcd(dx, dy)\n                dx, dy = dx // g, dy // g\n                if dx < 0 or (dx == 0 and dy < 0):\n                    dx, dy = -dx, -dy\n                slopes[(dx, dy)] += 1\n                best = max(best, slopes[(dx, dy)] + 1)\n        return best", "slug": "max-points-on-a-line"}, {"n": 154, "t": "Find Minimum in Rotated Sorted Array II", "topic": "Binary Search", "tags": ["Array"], "a": "Compare the middle with the right end. Larger means the minimum is to the right; smaller means it is at mid or left. Equal tells you nothing, so shrink the right end by one.", "tc": "O(log n) avg, O(n) worst", "sc": "O(1)", "code": "class Solution:\n    def findMin(self, nums):\n        lo, hi = 0, len(nums) - 1\n        while lo < hi:\n            mid = (lo + hi) // 2\n            if nums[mid] > nums[hi]:\n                lo = mid + 1\n            elif nums[mid] < nums[hi]:\n                hi = mid\n            else:\n                hi -= 1\n        return nums[lo]", "slug": "find-minimum-in-rotated-sorted-array-ii"}, {"n": 174, "t": "Dungeon Game", "topic": "Dynamic Programming", "tags": ["Matrix"], "a": "Work backwards from the princess. dp[j] is the minimum health needed on entering a cell: the cheaper of the next cells' requirements minus this cell's value, never below 1.", "tc": "O(m·n)", "sc": "O(n)", "code": "class Solution:\n    def calculateMinimumHP(self, dungeon):\n        m, n = len(dungeon), len(dungeon[0])\n        INF = float('inf')\n        dp = [INF] * (n + 1)\n        dp[n - 1] = 1\n        for i in range(m - 1, -1, -1):\n            for j in range(n - 1, -1, -1):\n                need = min(dp[j], dp[j + 1]) - dungeon[i][j]\n                dp[j] = max(1, need)\n        return dp[0]", "slug": "dungeon-game"}, {"n": 188, "t": "Best Time to Buy and Sell Stock IV", "topic": "Dynamic Programming", "tags": ["Array"], "a": "Generalise the two-transaction version: buy[j] and sell[j] hold the best balance after the j-th buy and j-th sell. Each price updates all k pairs in order.", "tc": "O(n·k)", "sc": "O(k)", "code": "class Solution:\n    def maxProfit(self, k, prices):\n        buy = [float('-inf')] * (k + 1)\n        sell = [0] * (k + 1)\n        for p in prices:\n            for j in range(1, k + 1):\n                buy[j] = max(buy[j], sell[j - 1] - p)\n                sell[j] = max(sell[j], buy[j] + p)\n        return sell[k]", "slug": "best-time-to-buy-and-sell-stock-iv"}, {"n": 212, "t": "Word Search II", "topic": "Trie", "tags": ["Backtracking", "Matrix"], "a": "Build a trie of all words and DFS the board while walking the trie, so one search finds every word sharing a prefix. Remove found words and prune empty trie branches to keep later searches short.", "tc": "O(m·n·4^L)", "sc": "O(total word chars)", "code": "class Solution:\n    def findWords(self, board, words):\n        root = {}\n        for w in words:\n            node = root\n            for ch in w:\n                node = node.setdefault(ch, {})\n            node['$'] = w\n        m, n, res = len(board), len(board[0]), []\n\n        def dfs(r, c, parent):\n            ch = board[r][c]\n            node = parent[ch]\n            if '$' in node:\n                res.append(node.pop('$'))\n            board[r][c] = '#'\n            for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):\n                if 0 <= nr < m and 0 <= nc < n and board[nr][nc] in node:\n                    dfs(nr, nc, node)\n            board[r][c] = ch\n            if not node:\n                parent.pop(ch)\n\n        for r in range(m):\n            for c in range(n):\n                if board[r][c] in root:\n                    dfs(r, c, root)\n        return res", "slug": "word-search-ii"}, {"n": 214, "t": "Shortest Palindrome", "topic": "String", "tags": ["KMP", "String Matching"], "a": "Find the longest palindromic prefix of s. Running the KMP failure function on s + '#' + reverse(s) gives its length directly. Prepend the reverse of the remaining suffix.", "tc": "O(n)", "sc": "O(n)", "code": "class Solution:\n    def shortestPalindrome(self, s):\n        t = s + '#' + s[::-1]\n        lps = [0] * len(t)\n        for i in range(1, len(t)):\n            k = lps[i - 1]\n            while k and t[i] != t[k]:\n                k = lps[k - 1]\n            if t[i] == t[k]:\n                k += 1\n            lps[i] = k\n        return s[lps[-1]:][::-1] + s", "slug": "shortest-palindrome"}, {"n": 218, "t": "The Skyline Problem", "topic": "Heap", "tags": ["Line Sweep", "Divide and Conquer"], "a": "Sweep x-coordinates with start events (negative heights) and end events. A max-heap holds live buildings; lazily drop ones that have ended. Emit a key point whenever the tallest live height changes.", "tc": "O(n log n)", "sc": "O(n)", "code": "import heapq\n\nclass Solution:\n    def getSkyline(self, buildings):\n        events = sorted([(l, -h, r) for l, r, h in buildings] +\n                        [(r, 0, 0) for _, r, _ in buildings])\n        res, heap = [], [(0, float('inf'))]\n        for x, negh, r in events:\n            while heap[0][1] <= x:\n                heapq.heappop(heap)\n            if negh:\n                heapq.heappush(heap, (negh, r))\n            top = -heap[0][0]\n            if not res or res[-1][1] != top:\n                res.append([x, top])\n        return res", "slug": "the-skyline-problem"}, {"n": 224, "t": "Basic Calculator", "topic": "Stack", "tags": ["Math", "String"], "a": "Keep a running result and the sign of the next number. On '(', push the result and sign and start fresh; on ')', fold the inner result back in with the saved sign.", "tc": "O(n)", "sc": "O(n)", "code": "class Solution:\n    def calculate(self, s):\n        res, num, sign, stack = 0, 0, 1, []\n        for ch in s:\n            if ch.isdigit():\n                num = num * 10 + int(ch)\n            elif ch in '+-':\n                res += sign * num\n                num, sign = 0, (1 if ch == '+' else -1)\n            elif ch == '(':\n                stack.append((res, sign))\n                res, sign = 0, 1\n            elif ch == ')':\n                res += sign * num\n                prev, psign = stack.pop()\n                res, num = prev + psign * res, 0\n        return res + sign * num", "slug": "basic-calculator"}, {"n": 233, "t": "Number of Digit One", "topic": "Math", "tags": ["Digit DP"], "a": "Count the 1s contributed by each decimal position separately. Split n into the digits above, the current digit and the digits below; the current digit decides whether the partial block adds 0, low + 1 or a full block.", "tc": "O(log n)", "sc": "O(1)", "code": "class Solution:\n    def countDigitOne(self, n):\n        count, m = 0, 1\n        while m <= n:\n            high, cur, low = n // (m * 10), n // m % 10, n % m\n            count += high * m\n            if cur == 1:\n                count += low + 1\n            elif cur > 1:\n                count += m\n            m *= 10\n        return count", "slug": "number-of-digit-one"}, {"n": 239, "t": "Sliding Window Maximum", "topic": "Sliding Window", "tags": ["Monotonic Queue", "Deque"], "a": "Keep a deque of indices whose values decrease from front to back. Pop smaller values from the back before pushing, drop the front once it leaves the window, and the front is always the maximum.", "tc": "O(n)", "sc": "O(k)", "code": "from collections import deque\n\nclass Solution:\n    def maxSlidingWindow(self, nums, k):\n        dq, res = deque(), []\n        for i, x in enumerate(nums):\n            while dq and nums[dq[-1]] <= x:\n                dq.pop()\n            dq.append(i)\n            if dq[0] <= i - k:\n                dq.popleft()\n            if i >= k - 1:\n                res.append(nums[dq[0]])\n        return res", "slug": "sliding-window-maximum"}, {"n": 273, "t": "Integer to English Words", "topic": "String", "tags": ["Math", "Recursion"], "a": "English groups numbers in threes. Convert each three-digit chunk with a small helper, then append Billion, Million or Thousand for the chunk's position, skipping chunks that are zero.", "tc": "O(1)", "sc": "O(1)", "code": "class Solution:\n    def numberToWords(self, num):\n        if num == 0:\n            return 'Zero'\n        ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight',\n                'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen',\n                'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen']\n        tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy',\n                'Eighty', 'Ninety']\n\n        def three(n):\n            out = []\n            if n >= 100:\n                out += [ones[n // 100], 'Hundred']\n                n %= 100\n            if n >= 20:\n                out.append(tens[n // 10])\n                n %= 10\n            if n:\n                out.append(ones[n])\n            return out\n\n        words = []\n        for value, name in ((10**9, 'Billion'), (10**6, 'Million'), (1000, 'Thousand'), (1, '')):\n            chunk, num = divmod(num, value)\n            if chunk:\n                words += three(chunk) + ([name] if name else [])\n        return ' '.join(words)", "slug": "integer-to-english-words"}, {"n": 282, "t": "Expression Add Operators", "topic": "Backtracking", "tags": ["Math", "String"], "a": "Try every next operand and each operator. Carry the last term so '*' can undo it and apply precedence: value - last + last * x. Operands with a leading zero stop the loop.", "tc": "O(4ⁿ)", "sc": "O(n)", "code": "class Solution:\n    def addOperators(self, num, target):\n        res = []\n\n        def go(i, path, value, last):\n            if i == len(num):\n                if value == target:\n                    res.append(path)\n                return\n            for j in range(i + 1, len(num) + 1):\n                s = num[i:j]\n                if len(s) > 1 and s[0] == '0':\n                    break\n                x = int(s)\n                if i == 0:\n                    go(j, s, x, x)\n                else:\n                    go(j, path + '+' + s, value + x, x)\n                    go(j, path + '-' + s, value - x, -x)\n                    go(j, path + '*' + s, value - last + last * x, last * x)\n\n        go(0, '', 0, 0)\n        return res", "slug": "expression-add-operators"}, {"n": 295, "t": "Find Median from Data Stream", "topic": "Heap", "tags": ["Design", "Data Stream"], "a": "A max-heap holds the smaller half and a min-heap the larger half, with the lower half at most one element bigger. The median is the top of the lower heap or the average of both tops.", "tc": "O(log n) add, O(1) median", "sc": "O(n)", "code": "import heapq\n\nclass MedianFinder:\n    def __init__(self):\n        self.lo = []  # max-heap, values negated\n        self.hi = []  # min-heap\n\n    def addNum(self, num):\n        heapq.heappush(self.lo, -num)\n        heapq.heappush(self.hi, -heapq.heappop(self.lo))\n        if len(self.hi) > len(self.lo):\n            heapq.heappush(self.lo, -heapq.heappop(self.hi))\n\n    def findMedian(self):\n        if len(self.lo) > len(self.hi):\n            return -self.lo[0]\n        return (-self.lo[0] + self.hi[0]) / 2", "slug": "find-median-from-data-stream"}, {"n": 297, "t": "Serialize and Deserialize Binary Tree", "topic": "Tree", "tags": ["Design", "DFS"], "a": "Write a preorder traversal with a marker for empty children. That sequence fixes the shape uniquely, so reading it back in the same order rebuilds the tree.", "tc": "O(n)", "sc": "O(n)", "code": "class Codec:\n    def serialize(self, root):\n        out = []\n\n        def pre(node):\n            if not node:\n                out.append('#')\n                return\n            out.append(str(node.val))\n            pre(node.left)\n            pre(node.right)\n\n        pre(root)\n        return ','.join(out)\n\n    def deserialize(self, data):\n        vals = iter(data.split(','))\n\n        def build():\n            v = next(vals)\n            if v == '#':\n                return None\n            node = TreeNode(int(v))\n            node.left = build()\n            node.right = build()\n            return node\n\n        return build()", "slug": "serialize-and-deserialize-binary-tree"}, {"n": 301, "t": "Remove Invalid Parentheses", "topic": "Backtracking", "tags": ["BFS", "String"], "a": "BFS by number of removals: each level deletes one more parenthesis. The first level that contains any valid string is the minimum, so return all valid strings from it.", "tc": "O(n·2ⁿ)", "sc": "O(n·2ⁿ)", "code": "class Solution:\n    def removeInvalidParentheses(self, s):\n        def valid(t):\n            bal = 0\n            for ch in t:\n                if ch == '(':\n                    bal += 1\n                elif ch == ')':\n                    bal -= 1\n                    if bal < 0:\n                        return False\n            return bal == 0\n\n        level = {s}\n        while level:\n            good = [t for t in level if valid(t)]\n            if good:\n                return good\n            level = {t[:i] + t[i + 1:] for t in level\n                     for i in range(len(t)) if t[i] in '()'}\n        return ['']", "slug": "remove-invalid-parentheses"}, {"n": 312, "t": "Burst Balloons", "topic": "Dynamic Programming", "tags": ["Interval DP"], "a": "Choose the last balloon to burst in each open interval (l, r). Its neighbours at that moment are the fixed ends l and r, so dp[l][r] = max over k of dp[l][k] + a[l]·a[k]·a[r] + dp[k][r].", "tc": "O(n³)", "sc": "O(n²)", "code": "class Solution:\n    def maxCoins(self, nums):\n        a = [1] + nums + [1]\n        n = len(a)\n        dp = [[0] * n for _ in range(n)]\n        for gap in range(2, n):\n            for l in range(n - gap):\n                r = l + gap\n                for k in range(l + 1, r):\n                    dp[l][r] = max(dp[l][r], dp[l][k] + a[l] * a[k] * a[r] + dp[k][r])\n        return dp[0][n - 1]", "slug": "burst-balloons"}, {"n": 315, "t": "Count of Smaller Numbers After Self", "topic": "Binary Search", "tags": ["Fenwick Tree", "Merge Sort"], "a": "Compress values to ranks and scan right to left. A Fenwick tree counts how many ranks below the current one have been seen, which is exactly the number of smaller elements to the right.", "tc": "O(n log n)", "sc": "O(n)", "code": "class Solution:\n    def countSmaller(self, nums):\n        ranks = {v: i + 1 for i, v in enumerate(sorted(set(nums)))}\n        tree = [0] * (len(ranks) + 1)\n        res = []\n        for x in reversed(nums):\n            r, s = ranks[x] - 1, 0\n            while r > 0:\n                s += tree[r]\n                r -= r & -r\n            res.append(s)\n            r = ranks[x]\n            while r < len(tree):\n                tree[r] += 1\n                r += r & -r\n        return res[::-1]", "slug": "count-of-smaller-numbers-after-self"}, {"n": 321, "t": "Create Maximum Number", "topic": "Greedy", "tags": ["Monotonic Stack"], "a": "For each split of k into i digits from nums1 and k-i from nums2, take the largest subsequence of each with a monotonic stack, then merge by always taking from the lexicographically larger remainder.", "tc": "O(k·(m + n)²)", "sc": "O(m + n)", "code": "class Solution:\n    def maxNumber(self, nums1, nums2, k):\n        def pick(nums, t):\n            drop, stack = len(nums) - t, []\n            for x in nums:\n                while drop and stack and stack[-1] < x:\n                    stack.pop()\n                    drop -= 1\n                stack.append(x)\n            return stack[:t]\n\n        def merge(a, b):\n            return [max(a, b).pop(0) for _ in range(len(a) + len(b))]\n\n        best = []\n        for i in range(max(0, k - len(nums2)), min(k, len(nums1)) + 1):\n            best = max(best, merge(pick(nums1, i), pick(nums2, k - i)))\n        return best", "slug": "create-maximum-number"}, {"n": 327, "t": "Count of Range Sum", "topic": "Divide and Conquer", "tags": ["Merge Sort", "Prefix Sum"], "a": "Count prefix-sum pairs i < j with lower ≤ pre[j] - pre[i] ≤ upper. During merge sort, both halves are sorted, so two forward-moving pointers in the right half find each left value's valid range.", "tc": "O(n log n)", "sc": "O(n)", "code": "class Solution:\n    def countRangeSum(self, nums, lower, upper):\n        pre = [0]\n        for x in nums:\n            pre.append(pre[-1] + x)\n\n        def sort(lo, hi):\n            if hi - lo <= 1:\n                return 0\n            mid = (lo + hi) // 2\n            count = sort(lo, mid) + sort(mid, hi)\n            i = j = mid\n            for left in pre[lo:mid]:\n                while i < hi and pre[i] - left < lower:\n                    i += 1\n                while j < hi and pre[j] - left <= upper:\n                    j += 1\n                count += j - i\n            pre[lo:hi] = sorted(pre[lo:hi])\n            return count\n\n        return sort(0, len(pre))", "slug": "count-of-range-sum"}, {"n": 329, "t": "Longest Increasing Path in a Matrix", "topic": "Graph", "tags": ["DFS", "Memoization", "Topological Sort"], "a": "Strictly increasing edges form a DAG, so a memoized DFS is safe: the longest path from a cell is 1 plus the best path from any larger neighbour.", "tc": "O(m·n)", "sc": "O(m·n)", "code": "from functools import lru_cache\n\nclass Solution:\n    def longestIncreasingPath(self, matrix):\n        m, n = len(matrix), len(matrix[0])\n\n        @lru_cache(None)\n        def dfs(r, c):\n            best = 1\n            for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):\n                if 0 <= nr < m and 0 <= nc < n and matrix[nr][nc] > matrix[r][c]:\n                    best = max(best, 1 + dfs(nr, nc))\n            return best\n\n        return max(dfs(r, c) for r in range(m) for c in range(n))", "slug": "longest-increasing-path-in-a-matrix"}, {"n": 330, "t": "Patching Array", "topic": "Greedy", "tags": ["Array"], "a": "If every sum below reach is buildable, a number x ≤ reach extends that range to reach + x. When the next number is too big or missing, patch with reach itself, which doubles the range.", "tc": "O(m + log n)", "sc": "O(1)", "code": "class Solution:\n    def minPatches(self, nums, n):\n        reach, i, patches = 1, 0, 0\n        while reach <= n:\n            if i < len(nums) and nums[i] <= reach:\n                reach += nums[i]\n                i += 1\n            else:\n                reach += reach\n                patches += 1\n        return patches", "slug": "patching-array"}, {"n": 332, "t": "Reconstruct Itinerary", "topic": "Graph", "tags": ["Eulerian Path", "DFS"], "a": "The tickets form an Eulerian path. Hierholzer's algorithm with neighbours in lexical order follows edges until stuck, appends dead ends to the route, and reverses at the end.", "tc": "O(E log E)", "sc": "O(E)", "code": "from collections import defaultdict\n\nclass Solution:\n    def findItinerary(self, tickets):\n        graph = defaultdict(list)\n        for a, b in sorted(tickets, reverse=True):\n            graph[a].append(b)\n        route, stack = [], ['JFK']\n        while stack:\n            while graph[stack[-1]]:\n                stack.append(graph[stack[-1]].pop())\n            route.append(stack.pop())\n        return route[::-1]", "slug": "reconstruct-itinerary"}, {"n": 336, "t": "Palindrome Pairs", "topic": "String", "tags": ["Hash Table", "Trie"], "a": "Split every word into prefix and suffix. If the prefix is a palindrome, the reverse of the suffix can go in front; if the suffix is a palindrome, the reverse of the prefix can go after. A hash map of words finds the partners.", "tc": "O(n·L²)", "sc": "O(n·L)", "code": "class Solution:\n    def palindromePairs(self, words):\n        index = {w: i for i, w in enumerate(words)}\n        res = []\n        for i, w in enumerate(words):\n            for k in range(len(w) + 1):\n                pre, suf = w[:k], w[k:]\n                if pre == pre[::-1]:\n                    j = index.get(suf[::-1])\n                    if j is not None and j != i:\n                        res.append([j, i])\n                if k != len(w) and suf == suf[::-1]:\n                    j = index.get(pre[::-1])\n                    if j is not None and j != i:\n                        res.append([i, j])\n        return res", "slug": "palindrome-pairs"}, {"n": 352, "t": "Data Stream as Disjoint Intervals", "topic": "Design", "tags": ["Binary Search", "Ordered Set"], "a": "Keep a sorted list of intervals. Binary search the new value's position, extend the interval before it if adjacent or insert a new one, then merge forward while neighbours touch.", "tc": "O(n) add, O(1) query", "sc": "O(n)", "code": "import bisect\n\nclass SummaryRanges:\n    def __init__(self):\n        self.iv = []\n\n    def addNum(self, value):\n        iv = self.iv\n        i = bisect.bisect_left(iv, [value, value])\n        if i > 0 and iv[i - 1][1] + 1 >= value:\n            i -= 1\n        else:\n            iv.insert(i, [value, value])\n        iv[i][1] = max(iv[i][1], value)\n        while i + 1 < len(iv) and iv[i + 1][0] <= iv[i][1] + 1:\n            iv[i][1] = max(iv[i][1], iv[i + 1][1])\n            iv.pop(i + 1)\n\n    def getIntervals(self):\n        return self.iv", "slug": "data-stream-as-disjoint-intervals"}, {"n": 354, "t": "Russian Doll Envelopes", "topic": "Binary Search", "tags": ["Dynamic Programming", "LIS"], "a": "Sort by width ascending and height descending, so equal widths can never nest. The answer is then the longest strictly increasing subsequence of heights, found with patience sorting.", "tc": "O(n log n)", "sc": "O(n)", "code": "import bisect\n\nclass Solution:\n    def maxEnvelopes(self, envelopes):\n        envelopes.sort(key=lambda e: (e[0], -e[1]))\n        tails = []\n        for _, h in envelopes:\n            i = bisect.bisect_left(tails, h)\n            if i == len(tails):\n                tails.append(h)\n            else:\n                tails[i] = h\n        return len(tails)", "slug": "russian-doll-envelopes"}, {"n": 363, "t": "Max Sum of Rectangle No Larger Than K", "topic": "Binary Search", "tags": ["Matrix", "Prefix Sum", "Ordered Set"], "a": "Fix a top and bottom row and collapse the band into column sums. For the 1D problem, keep sorted prefix sums and binary search the smallest earlier prefix ≥ current - k.", "tc": "O(m²·n log n)", "sc": "O(n)", "code": "import bisect\n\nclass Solution:\n    def maxSumSubmatrix(self, matrix, k):\n        m, n = len(matrix), len(matrix[0])\n        best = float('-inf')\n        for top in range(m):\n            sums = [0] * n\n            for bot in range(top, m):\n                for c in range(n):\n                    sums[c] += matrix[bot][c]\n                seen, pre = [0], 0\n                for x in sums:\n                    pre += x\n                    i = bisect.bisect_left(seen, pre - k)\n                    if i < len(seen):\n                        best = max(best, pre - seen[i])\n                    bisect.insort(seen, pre)\n                if best == k:\n                    return k\n        return best", "slug": "max-sum-of-rectangle-no-larger-than-k"}, {"n": 381, "t": "Insert Delete GetRandom O(1) - Duplicates allowed", "topic": "Design", "tags": ["Hash Table", "Randomized"], "a": "Store values in a list for uniform random picks and map each value to the set of its indices. To remove, overwrite the slot with the last element, fix that element's index set, and pop the tail.", "tc": "O(1) average", "sc": "O(n)", "code": "import random\nfrom collections import defaultdict\n\nclass RandomizedCollection:\n    def __init__(self):\n        self.vals = []\n        self.pos = defaultdict(set)\n\n    def insert(self, val):\n        self.pos[val].add(len(self.vals))\n        self.vals.append(val)\n        return len(self.pos[val]) == 1\n\n    def remove(self, val):\n        if not self.pos[val]:\n            return False\n        i = self.pos[val].pop()\n        last = self.vals[-1]\n        self.vals[i] = last\n        self.pos[last].add(i)\n        self.pos[last].discard(len(self.vals) - 1)\n        self.vals.pop()\n        return True\n\n    def getRandom(self):\n        return random.choice(self.vals)", "slug": "insert-delete-getrandom-o1-duplicates-allowed"}, {"n": 403, "t": "Frog Jump", "topic": "Dynamic Programming", "tags": ["Hash Table"], "a": "For each stone, record the set of jump sizes that can land on it. Process stones left to right and push k-1, k and k+1 forward to any stone they reach.", "tc": "O(n²)", "sc": "O(n²)", "code": "class Solution:\n    def canCross(self, stones):\n        jumps = {s: set() for s in stones}\n        jumps[stones[0]].add(0)\n        for s in stones:\n            for k in jumps[s]:\n                for step in (k - 1, k, k + 1):\n                    if step > 0 and s + step in jumps:\n                        jumps[s + step].add(step)\n        return bool(jumps[stones[-1]])", "slug": "frog-jump"}, {"n": 407, "t": "Trapping Rain Water II", "topic": "Heap", "tags": ["BFS", "Matrix"], "a": "Water escapes through the lowest point of the boundary. Start a min-heap with the border cells and always expand from the lowest wall; a lower neighbour fills to that wall's height and joins the boundary at that level.", "tc": "O(m·n log(m·n))", "sc": "O(m·n)", "code": "import heapq\n\nclass Solution:\n    def trapRainWater(self, heightMap):\n        m, n = len(heightMap), len(heightMap[0])\n        seen = [[False] * n for _ in range(m)]\n        heap = []\n        for r in range(m):\n            for c in range(n):\n                if r in (0, m - 1) or c in (0, n - 1):\n                    heapq.heappush(heap, (heightMap[r][c], r, c))\n                    seen[r][c] = True\n        water = 0\n        while heap:\n            h, r, c = heapq.heappop(heap)\n            for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):\n                if 0 <= nr < m and 0 <= nc < n and not seen[nr][nc]:\n                    seen[nr][nc] = True\n                    water += max(0, h - heightMap[nr][nc])\n                    heapq.heappush(heap, (max(h, heightMap[nr][nc]), nr, nc))\n        return water", "slug": "trapping-rain-water-ii"}, {"n": 410, "t": "Split Array Largest Sum", "topic": "Binary Search", "tags": ["Greedy", "Dynamic Programming"], "a": "Binary search the answer: for a cap on piece size, greedily count how many pieces are needed. The smallest cap that needs at most k pieces is the answer.", "tc": "O(n log(sum))", "sc": "O(1)", "code": "class Solution:\n    def splitArray(self, nums, k):\n        def pieces(cap):\n            count, cur = 1, 0\n            for x in nums:\n                if cur + x > cap:\n                    count += 1\n                    cur = 0\n                cur += x\n            return count\n\n        lo, hi = max(nums), sum(nums)\n        while lo < hi:\n            mid = (lo + hi) // 2\n            if pieces(mid) <= k:\n                hi = mid\n            else:\n                lo = mid + 1\n        return lo", "slug": "split-array-largest-sum"}, {"n": 432, "t": "All O`one Data Structure", "topic": "Design", "tags": ["Linked List", "Hash Table"], "a": "Keep a doubly linked list of count buckets in increasing order, each holding a set of keys, and map every key to its bucket. Inc and dec move a key to the neighbouring bucket, creating or deleting buckets as needed.", "tc": "O(1) every operation", "sc": "O(n)", "code": "class Bucket:\n    def __init__(self, count):\n        self.count = count\n        self.keys = set()\n        self.prev = self.next = None\n\nclass AllOne:\n    def __init__(self):\n        self.head, self.tail = Bucket(0), Bucket(float('inf'))\n        self.head.next, self.tail.prev = self.tail, self.head\n        self.where = {}\n\n    def _insert_after(self, node, count):\n        b = Bucket(count)\n        b.prev, b.next = node, node.next\n        node.next.prev = b\n        node.next = b\n        return b\n\n    def _drop_if_empty(self, b):\n        if not b.keys and b is not self.head:\n            b.prev.next, b.next.prev = b.next, b.prev\n\n    def inc(self, key):\n        cur = self.where.get(key, self.head)\n        nxt = cur.next\n        if nxt.count != cur.count + 1:\n            nxt = self._insert_after(cur, cur.count + 1)\n        nxt.keys.add(key)\n        self.where[key] = nxt\n        if cur is not self.head:\n            cur.keys.discard(key)\n            self._drop_if_empty(cur)\n\n    def dec(self, key):\n        cur = self.where[key]\n        cur.keys.discard(key)\n        if cur.count == 1:\n            del self.where[key]\n        else:\n            prv = cur.prev\n            if prv.count != cur.count - 1:\n                prv = self._insert_after(prv, cur.count - 1)\n            prv.keys.add(key)\n            self.where[key] = prv\n        self._drop_if_empty(cur)\n\n    def getMaxKey(self):\n        b = self.tail.prev\n        return next(iter(b.keys)) if b is not self.head else ''\n\n    def getMinKey(self):\n        b = self.head.next\n        return next(iter(b.keys)) if b is not self.tail else ''", "slug": "all-oone-data-structure"}, {"n": 440, "t": "K-th Smallest in Lexicographical Order", "topic": "Math", "tags": ["Trie"], "a": "The numbers 1..n form a 10-ary prefix tree. Count how many numbers sit under the current prefix; if k is beyond them, skip to the next sibling, otherwise step down into the first child.", "tc": "O(log² n)", "sc": "O(1)", "code": "class Solution:\n    def findKthNumber(self, n, k):\n        cur = 1\n        k -= 1\n        while k:\n            steps, a, b = 0, cur, cur + 1\n            while a <= n:\n                steps += min(n + 1, b) - a\n                a *= 10\n                b *= 10\n            if steps <= k:\n                k -= steps\n                cur += 1\n            else:\n                k -= 1\n                cur *= 10\n        return cur", "slug": "k-th-smallest-in-lexicographical-order"}, {"n": 446, "t": "Arithmetic Slices II - Subsequence", "topic": "Dynamic Programming", "tags": ["Hash Table"], "a": "dp[i][d] counts subsequences of length ≥ 2 that end at i with difference d. Extending any of dp[j][d] by nums[i] yields a slice of length ≥ 3, so add them to the total.", "tc": "O(n²)", "sc": "O(n²)", "code": "from collections import defaultdict\n\nclass Solution:\n    def numberOfArithmeticSlices(self, nums):\n        dp = [defaultdict(int) for _ in nums]\n        total = 0\n        for i in range(len(nums)):\n            for j in range(i):\n                d = nums[i] - nums[j]\n                cnt = dp[j][d]\n                total += cnt\n                dp[i][d] += cnt + 1\n        return total", "slug": "arithmetic-slices-ii-subsequence"}, {"n": 460, "t": "LFU Cache", "topic": "Design", "tags": ["Hash Table", "Linked List"], "a": "Group keys by use count, each group an OrderedDict in recency order, and track the minimum count. Evict the oldest key of the minimum group; a fresh insert always resets the minimum to 1.", "tc": "O(1) every operation", "sc": "O(capacity)", "code": "from collections import defaultdict, OrderedDict\n\nclass LFUCache:\n    def __init__(self, capacity):\n        self.cap = capacity\n        self.val = {}\n        self.freq = {}\n        self.groups = defaultdict(OrderedDict)\n        self.minf = 0\n\n    def _touch(self, key):\n        f = self.freq[key]\n        del self.groups[f][key]\n        if not self.groups[f]:\n            del self.groups[f]\n            if self.minf == f:\n                self.minf += 1\n        self.freq[key] = f + 1\n        self.groups[f + 1][key] = None\n\n    def get(self, key):\n        if key not in self.val:\n            return -1\n        self._touch(key)\n        return self.val[key]\n\n    def put(self, key, value):\n        if self.cap == 0:\n            return\n        if key in self.val:\n            self.val[key] = value\n            self._touch(key)\n            return\n        if len(self.val) == self.cap:\n            old, _ = self.groups[self.minf].popitem(last=False)\n            if not self.groups[self.minf]:\n                del self.groups[self.minf]\n            del self.val[old]\n            del self.freq[old]\n        self.val[key] = value\n        self.freq[key] = 1\n        self.groups[1][key] = None\n        self.minf = 1", "slug": "lfu-cache"}, {"n": 472, "t": "Concatenated Words", "topic": "Dynamic Programming", "tags": ["Trie", "String"], "a": "Run a Word Break check on each word against the whole set, but forbid the single split that uses the word itself. Any word that can still be segmented is concatenated.", "tc": "O(n·L³)", "sc": "O(n·L)", "code": "class Solution:\n    def findAllConcatenatedWordsInADict(self, words):\n        words_set = set(words)\n\n        def can(w):\n            n = len(w)\n            dp = [True] + [False] * n\n            for i in range(1, n + 1):\n                for j in range(i):\n                    if dp[j] and w[j:i] in words_set and not (j == 0 and i == n):\n                        dp[i] = True\n                        break\n            return dp[n]\n\n        return [w for w in words if w and can(w)]", "slug": "concatenated-words"}, {"n": 480, "t": "Sliding Window Median", "topic": "Sliding Window", "tags": ["Heap", "Ordered Set"], "a": "Keep the window in a sorted container. Each step removes the outgoing value and adds the incoming one in logarithmic time; the median is read from the middle index or two.", "tc": "O(n log k)", "sc": "O(k)", "code": "from sortedcontainers import SortedList  # available on LeetCode\n\nclass Solution:\n    def medianSlidingWindow(self, nums, k):\n        win = SortedList(nums[:k])\n        res = []\n        for i in range(k, len(nums) + 1):\n            res.append((win[k // 2] + win[(k - 1) // 2]) / 2)\n            if i < len(nums):\n                win.remove(nums[i - k])\n                win.add(nums[i])\n        return res", "slug": "sliding-window-median"}, {"n": 483, "t": "Smallest Good Base", "topic": "Math", "tags": ["Binary Search"], "a": "n written as m ones in base b means n = (bᵐ - 1)/(b - 1), so b is close to the (m-1)-th root of n. Try m from the largest possible length down and verify the few integer bases near that root; m = 2 always works with b = n - 1.", "tc": "O(log² n)", "sc": "O(1)", "code": "class Solution:\n    def smallestGoodBase(self, n):\n        num = int(n)\n        for m in range(num.bit_length(), 2, -1):\n            k = int(num ** (1 / (m - 1)))\n            for base in (k - 1, k, k + 1):\n                if base >= 2 and (base ** m - 1) // (base - 1) == num:\n                    return str(base)\n        return str(num - 1)", "slug": "smallest-good-base"}, {"n": 493, "t": "Reverse Pairs", "topic": "Divide and Conquer", "tags": ["Merge Sort", "Fenwick Tree"], "a": "Merge sort, and before merging two sorted halves, count pairs with one pointer that only moves forward through the right half while nums[i] > 2·nums[j].", "tc": "O(n log n)", "sc": "O(n)", "code": "class Solution:\n    def reversePairs(self, nums):\n        def sort(lo, hi):\n            if hi - lo <= 1:\n                return 0\n            mid = (lo + hi) // 2\n            count = sort(lo, mid) + sort(mid, hi)\n            j = mid\n            for i in range(lo, mid):\n                while j < hi and nums[i] > 2 * nums[j]:\n                    j += 1\n                count += j - mid\n            nums[lo:hi] = sorted(nums[lo:hi])\n            return count\n\n        return sort(0, len(nums))", "slug": "reverse-pairs"}, {"n": 502, "t": "IPO", "topic": "Heap", "tags": ["Greedy", "Sorting"], "a": "Sort projects by required capital. Before each pick, push every project you can now afford into a max-heap of profits, then take the most profitable one.", "tc": "O(n log n)", "sc": "O(n)", "code": "import heapq\n\nclass Solution:\n    def findMaximizedCapital(self, k, w, profits, capital):\n        projects = sorted(zip(capital, profits))\n        heap, i = [], 0\n        for _ in range(k):\n            while i < len(projects) and projects[i][0] <= w:\n                heapq.heappush(heap, -projects[i][1])\n                i += 1\n            if not heap:\n                break\n            w -= heapq.heappop(heap)\n        return w", "slug": "ipo"}, {"n": 514, "t": "Freedom Trail", "topic": "Dynamic Programming", "tags": ["String", "Memoization"], "a": "State is (ring position, key index). For the next key letter, try every ring position holding it, paying the shorter rotation either way plus one press, and memoize.", "tc": "O(k·r²)", "sc": "O(k·r)", "code": "from collections import defaultdict\nfrom functools import lru_cache\n\nclass Solution:\n    def findRotateSteps(self, ring, key):\n        n = len(ring)\n        where = defaultdict(list)\n        for i, ch in enumerate(ring):\n            where[ch].append(i)\n\n        @lru_cache(None)\n        def go(pos, i):\n            if i == len(key):\n                return 0\n            best = float('inf')\n            for j in where[key[i]]:\n                d = abs(j - pos)\n                best = min(best, min(d, n - d) + 1 + go(j, i + 1))\n            return best\n\n        return go(0, 0)", "slug": "freedom-trail"}, {"n": 546, "t": "Remove Boxes", "topic": "Dynamic Programming", "tags": ["Interval DP", "Memoization"], "a": "dp(l, r, k) is the best score for boxes l..r when k boxes matching boxes[l] are already attached on the left. Either remove that group now, or save it for a later matching box m by first clearing l+1..m-1.", "tc": "O(n⁴)", "sc": "O(n³)", "code": "from functools import lru_cache\n\nclass Solution:\n    def removeBoxes(self, boxes):\n        @lru_cache(None)\n        def dp(l, r, k):\n            if l > r:\n                return 0\n            while l < r and boxes[l] == boxes[l + 1]:\n                l += 1\n                k += 1\n            best = (k + 1) ** 2 + dp(l + 1, r, 0)\n            for m in range(l + 1, r + 1):\n                if boxes[m] == boxes[l]:\n                    best = max(best, dp(l + 1, m - 1, 0) + dp(m, r, k + 1))\n            return best\n\n        return dp(0, len(boxes) - 1, 0)", "slug": "remove-boxes"}, {"n": 552, "t": "Student Attendance Record II", "topic": "Dynamic Programming", "tags": ["Counting"], "a": "Track six states: absences used (0 or 1) and trailing lates (0, 1 or 2). Each day appends P, L or A and moves counts between states; sum every state at the end.", "tc": "O(n)", "sc": "O(1)", "code": "class Solution:\n    def checkRecord(self, n):\n        MOD = 10**9 + 7\n        dp = [[1, 0, 0], [0, 0, 0]]  # dp[absences][trailing lates]\n        for _ in range(n):\n            new = [[0] * 3 for _ in range(2)]\n            for a in range(2):\n                for l in range(3):\n                    v = dp[a][l]\n                    if not v:\n                        continue\n                    new[a][0] = (new[a][0] + v) % MOD              # P\n                    if l < 2:\n                        new[a][l + 1] = (new[a][l + 1] + v) % MOD  # L\n                    if a == 0:\n                        new[1][0] = (new[1][0] + v) % MOD          # A\n            dp = new\n        return sum(map(sum, dp)) % MOD", "slug": "student-attendance-record-ii"}, {"n": 629, "t": "K Inverse Pairs Array", "topic": "Dynamic Programming", "tags": ["Prefix Sum"], "a": "Placing number i can create 0 to i-1 new inversions, so dp_i[j] is the sum of dp_{i-1}[j-i+1..j]. A running window sum makes each row linear.", "tc": "O(n·k)", "sc": "O(k)", "code": "class Solution:\n    def kInversePairs(self, n, k):\n        MOD = 10**9 + 7\n        dp = [1] + [0] * k\n        for i in range(2, n + 1):\n            new, run = [0] * (k + 1), 0\n            for j in range(k + 1):\n                run += dp[j]\n                if j >= i:\n                    run -= dp[j - i]\n                new[j] = run % MOD\n            dp = new\n        return dp[k] % MOD", "slug": "k-inverse-pairs-array"}, {"n": 630, "t": "Course Schedule III", "topic": "Greedy", "tags": ["Heap", "Sorting"], "a": "Take courses in deadline order. Add each one; if time now overruns the deadline, drop the longest course taken so far. That keeps the count the same while freeing the most time.", "tc": "O(n log n)", "sc": "O(n)", "code": "import heapq\n\nclass Solution:\n    def scheduleCourse(self, courses):\n        courses.sort(key=lambda c: c[1])\n        heap, t = [], 0\n        for dur, last in courses:\n            heapq.heappush(heap, -dur)\n            t += dur\n            if t > last:\n                t += heapq.heappop(heap)\n        return len(heap)", "slug": "course-schedule-iii"}, {"n": 632, "t": "Smallest Range Covering Elements from K Lists", "topic": "Heap", "tags": ["Sliding Window", "Greedy"], "a": "Hold one element from each list in a min-heap and track the current maximum. The range [heap min, max] covers every list; advance the list that holds the minimum, and stop when any list runs out.", "tc": "O(N log k)", "sc": "O(k)", "code": "import heapq\n\nclass Solution:\n    def smallestRange(self, nums):\n        heap = [(row[0], i, 0) for i, row in enumerate(nums)]\n        heapq.heapify(heap)\n        hi = max(row[0] for row in nums)\n        best = [heap[0][0], hi]\n        while True:\n            lo, i, j = heapq.heappop(heap)\n            if hi - lo < best[1] - best[0]:\n                best = [lo, hi]\n            if j + 1 == len(nums[i]):\n                return best\n            nxt = nums[i][j + 1]\n            hi = max(hi, nxt)\n            heapq.heappush(heap, (nxt, i, j + 1))", "slug": "smallest-range-covering-elements-from-k-lists"}, {"n": 664, "t": "Strange Printer", "topic": "Dynamic Programming", "tags": ["Interval DP"], "a": "dp(i, j) starts by printing s[i] alone. If a later s[k] has the same character, one stroke can cover both, so the cost splits into dp(i, k-1) + dp(k+1, j).", "tc": "O(n³)", "sc": "O(n²)", "code": "from functools import lru_cache\n\nclass Solution:\n    def strangePrinter(self, s):\n        @lru_cache(None)\n        def dp(i, j):\n            if i > j:\n                return 0\n            best = dp(i + 1, j) + 1\n            for k in range(i + 1, j + 1):\n                if s[k] == s[i]:\n                    best = min(best, dp(i, k - 1) + dp(k + 1, j))\n            return best\n\n        return dp(0, len(s) - 1)", "slug": "strange-printer"}, {"n": 668, "t": "Kth Smallest Number in Multiplication Table", "topic": "Binary Search", "tags": ["Math"], "a": "Binary search the value. Row i holds min(x // i, n) entries ≤ x, so counting is linear in m. The smallest x with at least k entries is the answer.", "tc": "O(m log(m·n))", "sc": "O(1)", "code": "class Solution:\n    def findKthNumber(self, m, n, k):\n        lo, hi = 1, m * n\n        while lo < hi:\n            mid = (lo + hi) // 2\n            if sum(min(mid // i, n) for i in range(1, m + 1)) >= k:\n                hi = mid\n            else:\n                lo = mid + 1\n        return lo", "slug": "kth-smallest-number-in-multiplication-table"}, {"n": 685, "t": "Redundant Connection II", "topic": "Union Find", "tags": ["Graph"], "a": "Either one node has two parents, or there is a cycle, or both. Record the two candidate edges for a double parent, skip the later one, and union-find the rest: a cycle then means the earlier candidate (or the cycle edge) is the culprit.", "tc": "O(n α(n))", "sc": "O(n)", "code": "class Solution:\n    def findRedundantDirectedConnection(self, edges):\n        n = len(edges)\n        parent = [0] * (n + 1)\n        cand1 = cand2 = None\n        for u, v in edges:\n            if parent[v]:\n                cand1, cand2 = [parent[v], v], [u, v]\n            else:\n                parent[v] = u\n        root = list(range(n + 1))\n\n        def find(x):\n            while root[x] != x:\n                root[x] = root[root[x]]\n                x = root[x]\n            return x\n\n        for u, v in edges:\n            if [u, v] == cand2:\n                continue\n            ru, rv = find(u), find(v)\n            if ru == rv:\n                return cand1 if cand1 else [u, v]\n            root[rv] = ru\n        return cand2", "
