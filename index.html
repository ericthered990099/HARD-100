slug": "redundant-connection-ii"}, {"n": 689, "t": "Maximum Sum of 3 Non-Overlapping Subarrays", "topic": "Dynamic Programming", "tags": ["Prefix Sum", "Sliding Window"], "a": "Precompute every window sum of length k, plus the best window index at or before each position and at or after it. Then fix the middle window and combine the best left and right windows.", "tc": "O(n)", "sc": "O(n)", "code": "class Solution:\n    def maxSumOfThreeSubarrays(self, nums, k):\n        w = [sum(nums[:k])]\n        for i in range(k, len(nums)):\n            w.append(w[-1] + nums[i] - nums[i - k])\n        n = len(w)\n        left, best = [0] * n, 0\n        for i in range(n):\n            if w[i] > w[best]:\n                best = i\n            left[i] = best\n        right, best = [0] * n, n - 1\n        for i in range(n - 1, -1, -1):\n            if w[i] >= w[best]:\n                best = i\n            right[i] = best\n        ans, top = None, -1\n        for j in range(k, n - k):\n            a, c = left[j - k], right[j + k]\n            total = w[a] + w[j] + w[c]\n            if total > top:\n                ans, top = [a, j, c], total\n        return ans", "slug": "maximum-sum-of-3-non-overlapping-subarrays"}, {"n": 691, "t": "Stickers to Spell Word", "topic": "Dynamic Programming", "tags": ["Bitmask", "Memoization"], "a": "State is the multiset of letters still needed, kept as a sorted string. Only try stickers containing the first needed letter, which prunes duplicate orderings, and memoize the remainder.", "tc": "O(2ᵗ·s·t)", "sc": "O(2ᵗ)", "code": "from collections import Counter\nfrom functools import lru_cache\n\nclass Solution:\n    def minStickers(self, stickers, target):\n        packs = [Counter(s) for s in stickers]\n\n        @lru_cache(None)\n        def go(rest):\n            if not rest:\n                return 0\n            need = Counter(rest)\n            best = float('inf')\n            for p in packs:\n                if rest[0] not in p:\n                    continue\n                left = ''.join(ch * max(0, cnt - p[ch]) for ch, cnt in sorted(need.items()))\n                best = min(best, 1 + go(left))\n            return best\n\n        ans = go(''.join(sorted(target)))\n        return -1 if ans == float('inf') else ans", "slug": "stickers-to-spell-word"}, {"n": 715, "t": "Range Module", "topic": "Design", "tags": ["Binary Search", "Ordered Set"], "a": "Store all interval boundaries in one sorted list; even positions open a range and odd ones close it. Adding or removing replaces the slice of boundaries inside [left, right) and keeps an endpoint only where parity says it is needed.", "tc": "O(n) update, O(log n) query", "sc": "O(n)", "code": "import bisect\n\nclass RangeModule:\n    def __init__(self):\n        self.pts = []  # sorted boundaries: even index opens, odd index closes\n\n    def _update(self, left, right, add):\n        i = bisect.bisect_left(self.pts, left)\n        j = bisect.bisect_right(self.pts, right)\n        mid = []\n        if (i % 2 == 0) == add:\n            mid.append(left)\n        if (j % 2 == 0) == add:\n            mid.append(right)\n        self.pts[i:j] = mid\n\n    def addRange(self, left, right):\n        self._update(left, right, True)\n\n    def removeRange(self, left, right):\n        self._update(left, right, False)\n\n    def queryRange(self, left, right):\n        i = bisect.bisect_right(self.pts, left)\n        j = bisect.bisect_left(self.pts, right)\n        return i == j and i % 2 == 1", "slug": "range-module"}, {"n": 719, "t": "Find K-th Smallest Pair Distance", "topic": "Binary Search", "tags": ["Two Pointers", "Sorting"], "a": "Sort, then binary search the distance d. A sliding window counts pairs with distance ≤ d in linear time; the smallest d with at least k pairs wins.", "tc": "O(n log n + n log W)", "sc": "O(1)", "code": "class Solution:\n    def smallestDistancePair(self, nums, k):\n        nums.sort()\n\n        def count(d):\n            c = left = 0\n            for right, x in enumerate(nums):\n                while x - nums[left] > d:\n                    left += 1\n                c += right - left\n            return c\n\n        lo, hi = 0, nums[-1] - nums[0]\n        while lo < hi:\n            mid = (lo + hi) // 2\n            if count(mid) >= k:\n                hi = mid\n            else:\n                lo = mid + 1\n        return lo", "slug": "find-k-th-smallest-pair-distance"}, {"n": 726, "t": "Number of Atoms", "topic": "Stack", "tags": ["Hash Table", "String"], "a": "Tokenise into element-count pairs, '(' and ')count'. Push a fresh counter on '(', and on ')' multiply the top counter and merge it into the one below. Output the final counts in sorted order.", "tc": "O(n²) worst", "sc": "O(n)", "code": "import re\nfrom collections import Counter\n\nclass Solution:\n    def countOfAtoms(self, formula):\n        stack = [Counter()]\n        for name, n1, op, _, n2 in re.findall(r'([A-Z][a-z]*)(\\d*)|(\\()|(\\))(\\d*)', formula):\n            if name:\n                stack[-1][name] += int(n1 or 1)\n            elif op:\n                stack.append(Counter())\n            else:\n                top, k = stack.pop(), int(n2 or 1)\n                for atom, c in top.items():\n                    stack[-1][atom] += c * k\n        counts = stack[0]\n        return ''.join(a + (str(counts[a]) if counts[a] > 1 else '') for a in sorted(counts))", "slug": "number-of-atoms"}, {"n": 732, "t": "My Calendar III", "topic": "Design", "tags": ["Line Sweep", "Segment Tree"], "a": "Record +1 at each start and -1 at each end. After each booking, sweep the sorted time points with a running sum; its peak is the maximum overlap.", "tc": "O(n log n) per booking", "sc": "O(n)", "code": "from collections import Counter\n\nclass MyCalendarThree:\n    def __init__(self):\n        self.delta = Counter()\n\n    def book(self, startTime, endTime):\n        self.delta[startTime] += 1\n        self.delta[endTime] -= 1\n        best = cur = 0\n        for t in sorted(self.delta):\n            cur += self.delta[t]\n            best = max(best, cur)\n        return best", "slug": "my-calendar-iii"}, {"n": 741, "t": "Cherry Pickup", "topic": "Dynamic Programming", "tags": ["Matrix", "Memoization"], "a": "A round trip equals two people walking down together. After t steps both satisfy r + c = t, so (r1, c1, r2) fixes the state. Count a shared cell once and take the best of four joint moves.", "tc": "O(n³)", "sc": "O(n³)", "code": "from functools import lru_cache\n\nclass Solution:\n    def cherryPickup(self, grid):\n        n = len(grid)\n\n        @lru_cache(None)\n        def dp(r1, c1, r2):\n            c2 = r1 + c1 - r2\n            if max(r1, c1, r2, c2) >= n:\n                return float('-inf')\n            if grid[r1][c1] == -1 or grid[r2][c2] == -1:\n                return float('-inf')\n            got = grid[r1][c1] + (grid[r2][c2] if r1 != r2 else 0)\n            if r1 == c1 == n - 1:\n                return got\n            return got + max(dp(r1 + 1, c1, r2 + 1), dp(r1, c1 + 1, r2),\n                             dp(r1 + 1, c1, r2), dp(r1, c1 + 1, r2 + 1))\n\n        return max(0, dp(0, 0, 0))", "slug": "cherry-pickup"}, {"n": 753, "t": "Cracking the Safe", "topic": "Graph", "tags": ["Eulerian Circuit", "De Bruijn"], "a": "Each (n-1)-digit string is a node and appending a digit is an edge, so every password is one edge. An Eulerian circuit through this de Bruijn graph, found with Hierholzer's DFS, visits each password exactly once.", "tc": "O(kⁿ)", "sc": "O(kⁿ)", "code": "import sys\n\nclass Solution:\n    def crackSafe(self, n, k):\n        sys.setrecursionlimit(10000)\n        seen, out = set(), []\n\n        def dfs(node):\n            for d in map(str, range(k)):\n                edge = node + d\n                if edge not in seen:\n                    seen.add(edge)\n                    dfs(edge[1:])\n                    out.append(d)\n\n        start = '0' * (n - 1)\n        dfs(start)\n        return ''.join(out) + start", "slug": "cracking-the-safe"}, {"n": 765, "t": "Couples Holding Hands", "topic": "Greedy", "tags": ["Union Find", "Graph"], "a": "Partners are x and x^1. Walk the seats in pairs; if the right seat is not the left person's partner, swap the partner in. Each swap fixes one couple for good, which is optimal.", "tc": "O(n)", "sc": "O(n)", "code": "class Solution:\n    def minSwapsCouples(self, row):\n        pos = {p: i for i, p in enumerate(row)}\n        swaps = 0\n        for i in range(0, len(row), 2):\n            partner = row[i] ^ 1\n            if row[i + 1] != partner:\n                j = pos[partner]\n                row[i + 1], row[j] = row[j], row[i + 1]\n                pos[row[j]] = j\n                pos[row[i + 1]] = i + 1\n                swaps += 1\n        return swaps", "slug": "couples-holding-hands"}, {"n": 773, "t": "Sliding Puzzle", "topic": "Graph", "tags": ["BFS"], "a": "There are only 720 board states. Encode the board as a string and BFS by sliding the 0 to its fixed neighbour positions; the first time you reach '123450' is the minimum.", "tc": "O(6!·6)", "sc": "O(6!)", "code": "from collections import deque\n\nclass Solution:\n    def slidingPuzzle(self, board):\n        start = ''.join(str(x) for row in board for x in row)\n        moves = {0: (1, 3), 1: (0, 2, 4), 2: (1, 5), 3: (0, 4), 4: (1, 3, 5), 5: (2, 4)}\n        q, seen = deque([(start, 0)]), {start}\n        while q:\n            s, d = q.popleft()\n            if s == '123450':\n                return d\n            z = s.index('0')\n            for nz in moves[z]:\n                t = list(s)\n                t[z], t[nz] = t[nz], t[z]\n                t = ''.join(t)\n                if t not in seen:\n                    seen.add(t)\n                    q.append((t, d + 1))\n        return -1", "slug": "sliding-puzzle"}, {"n": 778, "t": "Swim in Rising Water", "topic": "Heap", "tags": ["Dijkstra", "Binary Search", "Union Find"], "a": "You need the path whose highest cell is lowest. A Dijkstra-style min-heap keyed on the running maximum always expands the cheapest frontier cell; the key when you reach the corner is the answer.", "tc": "O(n² log n)", "sc": "O(n²)", "code": "import heapq\n\nclass Solution:\n    def swimInWater(self, grid):\n        n = len(grid)\n        heap, seen = [(grid[0][0], 0, 0)], {(0, 0)}\n        while heap:\n            t, r, c = heapq.heappop(heap)\n            if r == c == n - 1:\n                return t\n            for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):\n                if 0 <= nr < n and 0 <= nc < n and (nr, nc) not in seen:\n                    seen.add((nr, nc))\n                    heapq.heappush(heap, (max(t, grid[nr][nc]), nr, nc))", "slug": "swim-in-rising-water"}, {"n": 780, "t": "Reaching Points", "topic": "Math", "tags": ["Euclid"], "a": "Work backwards: the larger coordinate must have come from subtracting the smaller, so repeat with modulo like Euclid's algorithm. When one coordinate reaches its start, check the other differs by a multiple.", "tc": "O(log max(tx, ty))", "sc": "O(1)", "code": "class Solution:\n    def reachingPoints(self, sx, sy, tx, ty):\n        while tx >= sx and ty >= sy:\n            if tx == sx and ty == sy:\n                return True\n            if tx > ty:\n                if ty == sy:\n                    return (tx - sx) % ty == 0\n                tx %= ty\n            else:\n                if tx == sx:\n                    return (ty - sy) % tx == 0\n                ty %= tx\n        return False", "slug": "reaching-points"}, {"n": 815, "t": "Bus Routes", "topic": "Graph", "tags": ["BFS", "Hash Table"], "a": "BFS where one step means boarding a bus. From a stop, ride every unvisited bus through it and enqueue all its stops. Marking buses as used keeps each route scanned once.", "tc": "O(sum of route lengths)", "sc": "O(sum of route lengths)", "code": "from collections import defaultdict, deque\n\nclass Solution:\n    def numBusesToDestination(self, routes, source, target):\n        if source == target:\n            return 0\n        stop_to_bus = defaultdict(list)\n        for b, route in enumerate(routes):\n            for s in route:\n                stop_to_bus[s].append(b)\n        q = deque([(source, 0)])\n        seen_stop, seen_bus = {source}, set()\n        while q:\n            stop, d = q.popleft()\n            for b in stop_to_bus[stop]:\n                if b in seen_bus:\n                    continue\n                seen_bus.add(b)\n                for s in routes[b]:\n                    if s == target:\n                        return d + 1\n                    if s not in seen_stop:\n                        seen_stop.add(s)\n                        q.append((s, d + 1))\n        return -1", "slug": "bus-routes"}, {"n": 827, "t": "Making A Large Island", "topic": "Graph", "tags": ["DFS", "Union Find", "Matrix"], "a": "Label every island with an id and record its size. For each water cell, add 1 to the sizes of the distinct islands touching it; the best total is the answer, or the whole grid if there is no water.", "tc": "O(n²)", "sc": "O(n²)", "code": "class Solution:\n    def largestIsland(self, grid):\n        n = len(grid)\n        size, label = {}, 2\n\n        def fill(r, c, lab):\n            stack, count = [(r, c)], 0\n            grid[r][c] = lab\n            while stack:\n                r, c = stack.pop()\n                count += 1\n                for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):\n                    if 0 <= nr < n and 0 <= nc < n and grid[nr][nc] == 1:\n                        grid[nr][nc] = lab\n                        stack.append((nr, nc))\n            return count\n\n        for r in range(n):\n            for c in range(n):\n                if grid[r][c] == 1:\n                    size[label] = fill(r, c, label)\n                    label += 1\n        best = max(size.values(), default=0)\n        for r in range(n):\n            for c in range(n):\n                if grid[r][c] == 0:\n                    labs = {grid[nr][nc]\n                            for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1))\n                            if 0 <= nr < n and 0 <= nc < n and grid[nr][nc] > 1}\n                    best = max(best, 1 + sum(size[l] for l in labs))\n        return best", "slug": "making-a-large-island"}, {"n": 828, "t": "Count Unique Characters of All Substrings of a Given String", "topic": "String", "tags": ["Dynamic Programming", "Contribution"], "a": "Count per occurrence instead of per substring. A character at index k is unique in every substring that starts after its previous occurrence j and ends before its next one i, which is (k - j)·(i - k) substrings.", "tc": "O(n)", "sc": "O(σ)", "code": "class Solution:\n    def uniqueLetterString(self, s):\n        last = {}  # char -> (latest index, index before that)\n        total = 0\n        for i, ch in enumerate(s):\n            k, j = last.get(ch, (-1, -1))\n            if k != -1:\n                total += (k - j) * (i - k)\n            last[ch] = (i, k)\n        n = len(s)\n        for k, j in last.values():\n            total += (k - j) * (n - k)\n        return total", "slug": "count-unique-characters-of-all-substrings-of-a-given-string"}, {"n": 834, "t": "Sum of Distances in Tree", "topic": "Tree", "tags": ["Rerooting", "DFS"], "a": "One pass from the root gets subtree sizes and the root's answer. Moving the root to a child brings its count[u] nodes one step closer and the other n - count[u] one step farther, so ans[u] = ans[p] - count[u] + (n - count[u]).", "tc": "O(n)", "sc": "O(n)", "code": "from collections import defaultdict\n\nclass Solution:\n    def sumOfDistancesInTree(self, n, edges):\n        g = defaultdict(list)\n        for a, b in edges:\n            g[a].append(b)\n            g[b].append(a)\n        order, parent = [], [-1] * n\n        stack, seen = [0], [False] * n\n        seen[0] = True\n        while stack:\n            u = stack.pop()\n            order.append(u)\n            for v in g[u]:\n                if not seen[v]:\n                    seen[v] = True\n                    parent[v] = u\n                    stack.append(v)\n        count, ans = [1] * n, [0] * n\n        for u in reversed(order):\n            p = parent[u]\n            if p != -1:\n                count[p] += count[u]\n                ans[p] += ans[u] + count[u]\n        for u in order:\n            p = parent[u]\n            if p != -1:\n                ans[u] = ans[p] - count[u] + (n - count[u])\n        return ans", "slug": "sum-of-distances-in-tree"}, {"n": 847, "t": "Shortest Path Visiting All Nodes", "topic": "Graph", "tags": ["BFS", "Bitmask"], "a": "State is (current node, set of visited nodes as a bitmask). Multi-source BFS from every node at once; the first state whose mask is full gives the shortest walk.", "tc": "O(n²·2ⁿ)", "sc": "O(n·2ⁿ)", "code": "from collections import deque\n\nclass Solution:\n    def shortestPathLength(self, graph):\n        n = len(graph)\n        full = (1 << n) - 1\n        q = deque((i, 1 << i, 0) for i in range(n))\n        seen = {(i, 1 << i) for i in range(n)}\n        while q:\n            u, mask, d = q.popleft()\n            if mask == full:\n                return d\n            for v in graph[u]:\n                nmask = mask | (1 << v)\n                if (v, nmask) not in seen:\n                    seen.add((v, nmask))\n                    q.append((v, nmask, d + 1))", "slug": "shortest-path-visiting-all-nodes"}, {"n": 857, "t": "Minimum Cost to Hire K Workers", "topic": "Heap", "tags": ["Greedy", "Sorting"], "a": "In any group everyone is paid at the highest wage-to-quality ratio, so cost = ratio × total quality. Sort by ratio; for each captain ratio, keep the k smallest qualities seen so far in a max-heap.", "tc": "O(n log n)", "sc": "O(n)", "code": "import heapq\n\nclass Solution:\n    def mincostToHireWorkers(self, quality, wage, k):\n        workers = sorted((w / q, q) for q, w in zip(quality, wage))\n        heap, qsum, best = [], 0, float('inf')\n        for ratio, q in workers:\n            heapq.heappush(heap, -q)\n            qsum += q\n            if len(heap) > k:\n                qsum += heapq.heappop(heap)\n            if len(heap) == k:\n                best = min(best, ratio * qsum)\n        return best", "slug": "minimum-cost-to-hire-k-workers"}, {"n": 862, "t": "Shortest Subarray with Sum at Least K", "topic": "Sliding Window", "tags": ["Monotonic Queue", "Prefix Sum"], "a": "Negative numbers break a plain window, so work on prefix sums. Keep a deque of increasing prefix values; pop from the front while it forms a valid subarray with the current prefix, and from the back while it is no better than the current prefix.", "tc": "O(n)", "sc": "O(n)", "code": "from collections import deque\n\nclass Solution:\n    def shortestSubarray(self, nums, k):\n        pre = [0]\n        for x in nums:\n            pre.append(pre[-1] + x)\n        dq, best = deque(), float('inf')\n        for i, p in enumerate(pre):\n            while dq and p - pre[dq[0]] >= k:\n                best = min(best, i - dq.popleft())\n            while dq and pre[dq[-1]] >= p:\n                dq.pop()\n            dq.append(i)\n        return best if best != float('inf') else -1", "slug": "shortest-subarray-with-sum-at-least-k"}, {"n": 871, "t": "Minimum Number of Refueling Stops", "topic": "Heap", "tags": ["Greedy", "Dynamic Programming"], "a": "Drive as far as fuel allows, putting every station you pass into a max-heap. When you run dry before the target, refuel retroactively from the biggest station passed so far.", "tc": "O(n log n)", "sc": "O(n)", "code": "import heapq\n\nclass Solution:\n    def minRefuelStops(self, target, startFuel, stations):\n        heap, reach, stops, i = [], startFuel, 0, 0\n        while reach < target:\n            while i < len(stations) and stations[i][0] <= reach:\n                heapq.heappush(heap, -stations[i][1])\n                i += 1\n            if not heap:\n                return -1\n            reach -= heapq.heappop(heap)\n            stops += 1\n        return stops", "slug": "minimum-number-of-refueling-stops"}, {"n": 887, "t": "Super Egg Drop", "topic": "Dynamic Programming", "tags": ["Math", "Binary Search"], "a": "Flip the question: with e eggs and m moves, how many floors can you cover? One drop splits the building into floors below (egg breaks) and above (it survives), so f(m, e) = f(m-1, e-1) + f(m-1, e) + 1. Raise m until f covers n.", "tc": "O(k·log n)", "sc": "O(k)", "code": "class Solution:\n    def superEggDrop(self, k, n):\n        dp = [0] * (k + 1)  # dp[e]: floors covered with e eggs in `moves` moves\n        moves = 0\n        while dp[k] < n:\n            moves += 1\n            for e in range(k, 0, -1):\n                dp[e] = dp[e] + dp[e - 1] + 1\n        return moves", "slug": "super-egg-drop"}, {"n": 895, "t": "Maximum Frequency Stack", "topic": "Design", "tags": ["Stack", "Hash Table"], "a": "Keep one stack per frequency level. Pushing a value with new frequency f appends it to stack f; popping takes from the highest non-empty level, which also breaks ties by recency.", "tc": "O(1) every operation", "sc": "O(n)", "code": "from collections import Counter, defaultdict\n\nclass FreqStack:\n    def __init__(self):\n        self.freq = Counter()\n        self.group = defaultdict(list)\n        self.maxf = 0\n\n    def push(self, val):\n        f = self.freq[val] + 1\n        self.freq[val] = f\n        self.maxf = max(self.maxf, f)\n        self.group[f].append(val)\n\n    def pop(self):\n        val = self.group[self.maxf].pop()\n        self.freq[val] -= 1\n        if not self.group[self.maxf]:\n            self.maxf -= 1\n        return val", "slug": "maximum-frequency-stack"}, {"n": 968, "t": "Binary Tree Cameras", "topic": "Tree", "tags": ["Greedy", "DFS"], "a": "Decide bottom-up and put cameras on parents of leaves, never on leaves. Each node reports uncovered, has a camera, or covered; a node with an uncovered child must hold a camera.", "tc": "O(n)", "sc": "O(h)", "code": "class Solution:\n    def minCameraCover(self, root):\n        UNCOVERED, CAMERA, COVERED = 0, 1, 2\n        cams = 0\n\n        def dfs(node):\n            nonlocal cams\n            if not node:\n                return COVERED\n            l, r = dfs(node.left), dfs(node.right)\n            if l == UNCOVERED or r == UNCOVERED:\n                cams += 1\n                return CAMERA\n            if l == CAMERA or r == CAMERA:\n                return COVERED\n            return UNCOVERED\n\n        if dfs(root) == UNCOVERED:\n            cams += 1\n        return cams", "slug": "binary-tree-cameras"}, {"n": 992, "t": "Subarrays with K Different Integers", "topic": "Sliding Window", "tags": ["Hash Table", "Counting"], "a": "Exactly k is hard to window directly, but at most k is easy: every right edge adds right - left + 1 subarrays. The answer is atMost(k) - atMost(k - 1).", "tc": "O(n)", "sc": "O(n)", "code": "from collections import Counter\n\nclass Solution:\n    def subarraysWithKDistinct(self, nums, k):\n        def at_most(k):\n            count, left, res = Counter(), 0, 0\n            for right, x in enumerate(nums):\n                if count[x] == 0:\n                    k -= 1\n                count[x] += 1\n                while k < 0:\n                    count[nums[left]] -= 1\n                    if count[nums[left]] == 0:\n                        k += 1\n                    left += 1\n                res += right - left + 1\n            return res\n\n        return at_most(k) - at_most(k - 1)", "slug": "subarrays-with-k-different-integers"}, {"n": 1235, "t": "Maximum Profit in Job Scheduling", "topic": "Dynamic Programming", "tags": ["Binary Search", "Sorting"], "a": "Sort jobs by end time and keep a staircase of (end time, best profit so far). For each job, binary search the best profit among jobs ending by its start, add its profit, and record it only if it beats the current best.", "tc": "O(n log n)", "sc": "O(n)", "code": "import bisect\n\nclass Solution:\n    def jobScheduling(self, startTime, endTime, profit):\n        jobs = sorted(zip(endTime, startTime, profit))\n        ends, best = [0], [0]\n        for e, s, p in jobs:\n            i = bisect.bisect_right(ends, s) - 1\n            cand = best[i] + p\n            if cand > best[-1]:\n                ends.append(e)\n                best.append(cand)\n        return best[-1]", "slug": "maximum-profit-in-job-scheduling"}];
const KW = new Set('and as assert break class continue def del elif else except False finally for from global if import in is lambda None nonlocal not or pass raise return True try while with yield'.split(' '));
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function hl(code) {
  const re = /(#[^\n]*)|([rbf]?'(?:\\.|[^'\\\n])*'|[rbf]?"(?:\\.|[^"\\\n])*")|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|([\s\S])/g;
  let out = '', m, prevDef = false;
  while ((m = re.exec(code))) {
    if (m[1]) out += '<span class="c">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="s">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="n">' + m[3] + '</span>';
    else if (m[4]) {
      const w = m[4];
      if (KW.has(w)) { out += '<span class="k">' + w + '</span>'; prevDef = (w === 'def' || w === 'class'); continue; }
      out += prevDef ? '<span class="d">' + w + '</span>' : (w === 'self' ? '<span class="sf">self</span>' : w);
    } else { out += esc(m[5]); if (m[5].trim()) prevDef = false; continue; }
    prevDef = false;
  }
  return out;
}

let solved = new Set();
try { solved = new Set(JSON.parse(localStorage.getItem('hard100-solved') || '[]')); } catch (e) {}
const save = () => { try { localStorage.setItem('hard100-solved', JSON.stringify([...solved])); } catch (e) {} };

const state = { q: '', topic: 'All', status: 'all' };
const listEl = document.getElementById('list');
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>';

const items = DATA.map(p => {
  const li = document.createElement('li');
  li.className = 'item';
  li.id = 'p' + p.n;
  li.innerHTML =
    '<div class="head">' +
      '<button class="check" aria-pressed="false" aria-label="Mark ' + esc(p.t) + ' as solved"><span>' + CHECK + '</span></button>' +
      '<button class="open" aria-expanded="false" aria-controls="d' + p.n + '">' +
        '<span class="num">' + p.n + '</span><span class="title">' + esc(p.t) + '</span>' +
        '<span class="topic">' + esc(p.topic) + '</span>' + CHEV +
      '</button>' +
    '</div><div class="detail" id="d' + p.n + '" hidden></div>';
  const hay = (p.n + ' ' + p.t + ' ' + p.topic + ' ' + p.tags.join(' ')).toLowerCase();
  return { p, li, hay };
});
items.forEach(it => listEl.appendChild(it.li));

function fillDetail(it) {
  const d = it.li.querySelector('.detail');
  if (d.dataset.ready) return d;
  const p = it.p;
  d.innerHTML =
    '<div class="tags">' + [p.topic, ...p.tags].map(t => '<span>' + esc(t) + '</span>').join('') + '</div>' +
    '<div><p class="label">Approach</p><p class="approach">' + esc(p.a) + '</p></div>' +
    '<dl class="cx"><div><dt>Time</dt><dd>' + esc(p.tc) + '</dd></div><div><dt>Space</dt><dd>' + esc(p.sc) + '</dd></div></dl>' +
    '<div class="code"><div class="code-top"><span>Python 3</span><button class="copy" type="button">Copy</button></div>' +
    '<pre><code>' + hl(p.code) + '</code></pre></div>' +
    '<div class="links"><a href="https://leetcode.com/problems/' + p.slug + '/" target="_blank" rel="noopener">Open on LeetCode ↗</a></div>';
  d.dataset.ready = '1';
  d.querySelector('.copy').addEventListener('click', e => {
    const btn = e.currentTarget;
    const done = () => { btn.textContent = 'Copied'; setTimeout(() => btn.textContent = 'Copy', 1400); };
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(d.querySelector('pre'));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = 'Selected';
      setTimeout(() => btn.textContent = 'Copy', 1400);
    };
    try { navigator.clipboard.writeText(p.code).then(done, fallback); } catch (err) { fallback(); }
  });
  return d;
}

function toggle(it, force) {
  const open = force ?? !it.li.classList.contains('is-open');
  const d = fillDetail(it);
  d.hidden = !open;
  it.li.classList.toggle('is-open', open);
  it.li.querySelector('.open').setAttribute('aria-expanded', open);
}

function paintSolved(it) {
  const on = solved.has(it.p.n);
  it.li.classList.toggle('done', on);
  it.li.querySelector('.check').setAttribute('aria-pressed', on);
}

items.forEach(it => {
  paintSolved(it);
  it.li.querySelector('.open').addEventListener('click', () => toggle(it));
  it.li.querySelector('.check').addEventListener('click', () => {
    solved.has(it.p.n) ? solved.delete(it.p.n) : solved.add(it.p.n);
    save(); paintSolved(it); updateCounts(); if (state.status !== 'all') render();
  });
});

// Topic chips
const topicCounts = {};
DATA.forEach(p => topicCounts[p.topic] = (topicCounts[p.topic] || 0) + 1);
const topics = Object.keys(topicCounts).sort((a, b) => topicCounts[b] - topicCounts[a] || a.localeCompare(b));
document.getElementById('topicCount').textContent = topics.length;
const chipsEl = document.getElementById('chips');
['All', ...topics].forEach(t => {
  const b = document.createElement('button');
  b.className = 'chip'; b.type = 'button'; b.dataset.topic = t;
  b.setAttribute('aria-pressed', t === 'All');
  b.innerHTML = esc(t) + '<small>' + (t === 'All' ? DATA.length : topicCounts[t]) + '</small>';
  b.addEventListener('click', () => {
    state.topic = t;
    chipsEl.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
    render();
  });
  chipsEl.appendChild(b);
});

document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  state.status = b.dataset.status;
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
}));

const q = document.getElementById('q');
q.addEventListener('input', () => { state.q = q.value.trim().toLowerCase(); render(); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; state.q = ''; render(); q.blur(); }
});
document.getElementById('collapse').addEventListener('click', () => items.forEach(it => it.li.classList.contains('is-open') && toggle(it, false)));

function updateCounts() {
  document.getElementById('doneCount').textContent = solved.size;
  document.getElementById('progressBar').style.width = solved.size + '%';
}

function render() {
  const terms = state.q.split(/\s+/).filter(Boolean);
  let shown = 0;
  items.forEach(it => {
    const okTopic = state.topic === 'All' || it.p.topic === state.topic;
    const isDone = solved.has(it.p.n);
    const okStatus = state.status === 'all' || (state.status === 'done') === isDone;
    const okQ = terms.every(t => it.hay.includes(t));
    const vis = okTopic && okStatus && okQ;
    it.li.hidden = !vis;
    if (vis) shown++;
  });
  listEl.hidden = shown === 0;
  const empty = document.getElementById('empty');
  empty.hidden = shown !== 0;
  empty.textContent = state.status === 'done' && !solved.size
    ? 'Nothing checked off yet. Tap the circle next to a problem once you solve it.'
    : 'No problems match these filters.';
  document.getElementById('showing').textContent = shown === DATA.length ? 'All 100 problems' : 'Showing ' + shown + ' of 100';
}

updateCounts();
render();
const h = location.hash.slice(1);
const target = items.find(it => it.li.id === h);
if (target) { toggle(target, true); target.li.scrollIntoView({ block: 'start' }); }
</script>
